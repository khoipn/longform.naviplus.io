  faq_label: "Preguntas frecuentes"
  faq_title: "Antes de empezar"
  faq1_q: "¿Navi+ ralentizará mi sitio web?"
  faq1_a: "No. Navi+ funciona en una CDN global con servidores en 6 continentes, utilizado por más de 5.000 comerciantes. Normalmente añade menos de 10 ms al tiempo de carga y está continuamente optimizado."
  faq2_q: "¿Es Navi+ confiable? ¿Hay garantía de disponibilidad?"
  faq2_a: "Todos los planes funcionan en infraestructura de alta calidad con SLA del 99,00 %. Los planes Elite pasan a Cloudflare + BunnyCDN para SLA del 99,99 %. Navi+ ha procesado millones de solicitudes sin interrupciones."
  faq3_q: "¿Cuánto tiempo tarda en estar en línea?"
  faq3_a: "La mayoría de las tiendas están en línea en menos de 5 minutos. Instala desde Shopify App Store (o pega un fragmento de código), elige una plantilla y publica — sin código, sin editar el tema."
  faq4_q: "¿Necesito saber programar?"
  faq4_a: "Para nada. Navi+ es completamente de arrastrar y soltar. Elige una plantilla, personaliza colores e iconos y publica. Los usuarios avanzados pueden añadir CSS o HTML personalizado."
  faq5_q: "¿Hay un plan gratuito?"
  faq5_a: "Sí. El plan Starter es gratuito para siempre — 1 menú, 50.000 vistas/mes, todas las funciones básicas, sin tarjeta de crédito. Actualiza solo cuando necesites más."
  coming_soon_name: "Próximamente"
  coming_soon_desc: "Seguimos desarrollando nuevos tipos de menús para mejorar la navegación de tu sitio web."
  platform_other_name: "Cualquier sitio web"
  platform_other_desc: "Compatible con Wix, Squarespace, Webflow o cualquier sitio web. Añade un fragmento de código y tu menú Navi+ estará en línea — sin restricciones de plataforma."
  platform_other_cta: "Crear cuenta gratuita →"
  speed_label: "Rendimiento"
  speed_title: "Ultraligero.\nUltrarrápido."
  speed_1_title: "Conectar. Desconectar. Sin rastro."
  speed_1_body: "Un snippet para instalar, un clic para eliminar. Sin modificaciones de tema, sin código residual, sin dependencias."
  speed_2_title: "Distribuido desde el edge, no desde nosotros."
  speed_2_body: "Tu menú carga desde nodos Cloudflare y BunnyCDN en todo el mundo. Sin backend en la ruta crítica — sigue siendo rápido aunque nuestros servidores fallen."
  speed_3_title: "Acelerado por IA, por defecto."
  speed_3_body: "Genera menús, escribe descripciones y optimiza la navegación con IA. Cada flujo de trabajo tiene IA integrada para que trabajes más rápido."


why_navi_page:
  seo_title: "¿Por qué Navi+? — 7 criterios para un menú de navegación profesional | Navi+"
  seo_desc: "El tema predeterminado te da una barra de texto plana. Navi+ resuelve los 7 criterios que un menú de navegación profesional debe cumplir."
  hero_tag: "Diseño & Interfaz"
  problem_intro: "Con suerte, los visitantes encuentran lo que necesitan en los primeros segundos de llegar a tu sitio. Pero cuando eso no ocurre — y en la realidad así es en la mayoría de las visitas — el primer lugar donde miran, lo primero que hacen clic, es el menú de navegación."
  p1_title: "Tu menú es demasiado simple"
  p1_desc: "Tu tema te da una barra de texto plana. Sin imágenes, sin agrupación, sin orientación. Los visitantes miran y no entienden qué vendes — y se van."
  p2_title: "Quieres cambiar, pero no sabes por dónde empezar"
  p2_desc: "Sabes que el menú necesita mejorar. Pero el tema es confuso, las apps tienen riesgo de conflictos, los desarrolladores cuestan dinero. No hay un camino claro a seguir."
  p3_title: "Difícil de controlar y mantener con el tiempo"
  p3_desc: "Cambiar de tema significa perder todo. Actualizar conlleva riesgo. Incluso cambiar un banner estacional requiere un desarrollador. Tu menú — el que debería ser el más fácil de controlar — es el que menos controlas."
  criteria_label: "Estándares Profesionales"
  criteria_title: "Estos son los 7 requisitos de un menú de navegación profesional"
  criteria_lead: "El menú es el segundo elemento más interactuado en cualquier sitio web (después del botón \"Añadir al carrito\"). Esto es lo que debes exigir:"
  c1_title: "Versátil — y cuenta una historia"
  c1_desc: "Debe incluir todos los estilos: Mega Menu para escritorio, Tab Bar para móvil, Slide Menu para un hamburger limpio, FAB para acciones urgentes, Grid Menu para landing pages. Más importante: el menú debe guiar el viaje de compra, no solo listar categorías."
  c2_title: "Compatible — sin conflictos"
  c2_desc: "Debe coexistir con el resto de tu sitio. Sin ocultar el carrito, sin romper el panel de búsqueda, sin superponerse al widget de chat. Al cambiar de tema, nada se pierde — el menú existe independientemente del tema."
  c3_title: "Rápido y extremadamente confiable"
  c3_desc: "El menú nunca debe \"morir\". Debe cargar rápido, funcionar con conexiones lentas y nunca bloquear el renderizado de la página principal. Es el componente que debe estar siempre listo — en cualquier dispositivo, en cualquier momento."
  c4_title: "Medible — hasta el nivel de cada ítem"
  c4_desc: "Debe rastrear cuántas veces cada ítem fue mostrado (impresiones) y cuántas veces fue clicado. Google Analytics no puede hacer esto. Sin estos datos, cada cambio en el menú es solo una suposición."
  c5_title: "Integración con otras apps del sitio"
  c5_desc: "Debe poder abrir la barra de búsqueda, el panel del carrito y el widget de chat. Debe soportar llamadas JavaScript para integrarse con cualquier app. Un menú moderno es un punto de control central — no un índice estático."
  c6_title: "Multilingüe y multi-mercado"
  c6_desc: "Debe integrarse con Shopify Markets, WordPress multilingüe, y mostrar la moneda y etiquetas correctas para cada mercado. Eso es un estándar, no una función premium."
  c7_title: "Independiente — sin necesidad de desarrollador"
  c7_desc: "Tú — el propietario del sitio — debes poder cambiar el menú cuando lo necesites. Temporada de rebajas, lanzamiento de nueva colección, cambio de estrategia de marketing, A/B test — todo debe hacerse mediante arrastrar y soltar, sin desarrollador, sin despliegue."
  solution_label: "Solución"
  solution_title: "Navi+ AI Menu Builder — resuelve los 7 criterios"
  solution_lead: "Navi+ es un <strong>creador de menús sin código</strong> — para crear menús hermosos y de alta conversión para cualquier sitio sin tocar el tema ni escribir una línea de código."
  how_heading: "Cómo funciona Navi+"
  how_desc: "Navi+ es un <strong style=\"color:#0f1117;\">widget</strong> — no reemplaza ni modifica tu tema existente. Todo se gestiona desde el dashboard. Los cambios se publican instantáneamente."
  s1_title: "Crea tu menú en el dashboard"
  s1_desc: "Arrastra y suelta, sin código. Tienes control total."
  s2_title: "Incrusta una sola vez"
  s2_desc: "App Block en Shopify o un snippet en otras plataformas."
  s3_title: "El menú se renderiza en tu sitio — independiente del tema"
  s3_desc: "Cambia de tema todas las veces que quieras, tu menú permanece intacto. Publicación instantánea."
  speed_badge: "Entregado via Cloudflare CDN · <span>~52ms</span> de tiempo de carga promedio"
  platforms_label: "Funciona con cualquier plataforma"
  platform_any: "Cualquier sitio web"
  not_label: "Navi+ NO es"
  not1: "<strong style=\"color:#0f1117;\">No es un tema</strong> — funciona en paralelo con tu tema actual, no lo reemplaza."
  not2: "<strong style=\"color:#0f1117;\">Sin instalación manual</strong> — un App Block (Shopify), plugin (WordPress) o un snippet es suficiente."
  not3: "<strong style=\"color:#0f1117;\">No puede dañar tu sitio</strong> — si Navi+ se desactiva, el menú original del tema regresa automáticamente."
  feats_label: "Características Principales"
  f1_title: "5 tipos de menú en una sola app"
  f1_desc: "Mega Menu · Tab Bar · Slide Menu · FAB · Grid Menu. Combina según necesidad, diseña con arrastrar y soltar."
  f2_title: "Independiente del tema"
  f2_desc: "Cambia de tema cuantas veces quieras sin perder el menú. La configuración se guarda de forma independiente en el dashboard."
  f3_title: "Analytics por ítem"
  f3_desc: "Impresiones · Clics · CTR para cada ítem. Una función que casi ningún otro creador de menús ofrece."
  f4_title: "Integración profunda con el sitio"
  f4_desc: "Abre panel del carrito · búsqueda · chat · JavaScript API. No solo enlaces estáticos."
  f5_title: "Multilingüe & Shopify Markets"
  f5_desc: "Configura una vez, el menú muestra automáticamente el idioma y la moneda correctos para cada mercado."
  f6_title: "Visualización condicional"
  f6_desc: "Por dispositivo · URL · estado del cliente · idioma. Todo sin código."
  f7_title: "Autonomía total"
  f7_desc: "¿Temporada de rebajas? Actualiza el banner en 2 minutos. ¿Nuevo lanzamiento? Publica ahora. Sin desarrollador."
  f8_title: "Soporte real"
  f8_desc: "Chat en vivo en el dashboard, respuestas en minutos. Navi+ Care está listo para diseñar por ti."
