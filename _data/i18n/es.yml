  enterprise:
    title: "¿Necesitas un plan personalizado para agencia o enterprise?"
    body: "Contáctanos para volume pricing, opciones white-label y soporte dedicado."
  faq:
    title: "FAQ de precios"
    subtitle: "Todo lo que necesitas saber antes de elegir un plan."
    items:
      - q: "Quiero probar funciones Premium. ¿Qué hago?"
        a: "La mayoría de funciones avanzadas son visibles en el editor para que entiendas cómo podría estructurarse tu menú. Por ejemplo, la subida de imágenes puede aparecer en Starter, pero las partes Premium estarán en gris o limitadas. Para probar la experiencia completa de forma segura, actualiza a un plan de pago y usa la prueba gratis de 7 días — no pagarás nada durante el periodo de prueba."
      - q: "¿Con qué plan debería empezar?"
        a: "Empieza con Starter si solo necesitas un menú Navi+ AI Menu Builder y quieres validar la experiencia. Elige Business si necesitas más menús, subida de imágenes, multidioma, analytics e interacciones avanzadas. Elige Elite cuando la navegación sea una parte central de tu tienda y quieras uso ilimitado, soporte SEO, CDN premium y ayuda hands-on."
      - q: "¿Qué pasa si Starter o Business llega al límite de vistas?"
        a: "Starter incluye hasta 50,000 vistas Navi+ AI Menu Builder, y Business hasta 500,000 vistas Navi+ AI Menu Builder al mes. Cuando tu tienda alcance el límite, primero recibirás un email de aviso. Si ocurre repetidamente, podemos colocar un pequeño anuncio en una esquina del menú sin afectar la experiencia del visitante. Importante: nunca ocultamos tu menú, porque eso afectaría a tus clientes."
      - q: "¿Cómo pruebo Business o Elite sin riesgo?"
        a: "Usa la prueba gratis de 7 días para publicar menús reales, probar interacciones premium, subir imágenes y revisar analytics antes de pagar. Si Navi+ AI Menu Builder no encaja, cancela antes de que termine la prueba y no se te cobrará."
      - q: "¿Perderé mis menús si hago downgrade después?"
        a: "No. Tus configuraciones se guardan. Si el plan inferior no puede mantener todas las funciones activas — menús extra, subida de imágenes, multidioma, interacciones avanzadas o SEO exclusivo de Elite — elegirás qué sigue activo en lugar de perder tu trabajo."
      - q: "¿Cuándo Elite es mejor que Business?"
        a: "Elige Elite cuando quieras quitar límites: menús ilimitados, vistas ilimitadas, herramientas avanzadas de imagen, SEO Search optimization, failover CDN global más fuerte, nunca publicidad y ayuda hands-on del equipo Navi+ AI Menu Builder. Es mejor cuando la navegación es central para tu tienda."
      - q: "¿Navi+ AI Menu Builder puede reemplazar otras apps de pago?"
        a: "A menudo, sí. Navi+ AI Menu Builder puede reemplazar partes de temas premium de navegación, menu builders, botones flotantes de contacto, herramientas de iconos cart/search y reemplazos de chat bubble. A $6.25/mes en Business, suele costar menos que varias apps pequeñas juntas."
      - q: "¿Navi+ AI Menu Builder funciona fuera de Shopify?"
        a: "Sí. Crea una cuenta gratis en dash.naviplus.app, copia tu embed snippet y pégalo en WordPress, Wix, Webflow o cualquier sitio. Mantienes la misma estructura de planes y el mismo editor Navi+ AI Menu Builder."
