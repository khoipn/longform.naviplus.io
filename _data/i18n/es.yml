  step1_title: "Instalar Navi+ AI Menu Builder"
  step1_body: "Agrega la aplicación desde Shopify App Store — o pega un simple fragmento de código en WordPress, Wix o cualquier plataforma. Plan gratuito disponible, sin tarjeta de crédito requerida."
  step2_title: "Elige una plantilla"
  step2_body: "Elige entre 20+ diseños de navegación prediseñados. Tab bar para móvil, mega menu para escritorio, slide menu para cualquier pantalla. Cada plantilla es completamente personalizable."
  step3_title: "Publica y guía visitantes"
  step3_body: "Arrastra, suelta y configura. Tu nuevo menú se activa al instante — ultra rápido a través de CDN edge en 6 continentes, manejando millones de solicitudes sin ralentizar tu tienda."
  navtypes_label: "Tipos de navegación"
  navtypes_title: "Diseñado para cada pantalla"
  navtypes_sub: "Cada tipo de navegación sirve un propósito diferente — configúralos independientemente para móvil y escritorio desde un único panel."
  mega_menu_desc: "Muestra un menú desplegable rico con columnas, imágenes y enlaces destacados. Perfecto para tiendas con grandes catálogos — guía a los compradores directamente a la categoría correcta sin sobrecargarlos."
  tab_bar_desc: "Una barra de navegación fija en la parte inferior para móvil — como las aplicaciones nativas. Coloca tus páginas más importantes a un toque de distancia, aumentando el compromiso y reduciendo la tasa de rebote."
  slide_menu_desc: "Un panel deslizable suave que revela tu navegación completa sin salir de la página. Ideal para tiendas orientadas a móvil que quieren una experiencia de navegación limpia y sin distracciones."
  sticky_navbar_desc: "Una barra de navegación superior que permanece visible mientras los visitantes se desplazan. Mantiene tu marca, búsqueda y carrito siempre accesibles — reduciendo la fricción e incrementando las conversiones."
