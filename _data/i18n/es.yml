  faq_label: "Preguntas frecuentes"
  faq_title: "Preguntas comunes"
  faq1_q: "¿Navi+ AI Menu Builder entrará en conflicto con mi tema actual?"
  faq1_a: "No. Navi+ AI Menu Builder está construido con HTML5 y CSS3 puro, sin librerías JavaScript externas. Esto significa cero conflictos con tu tema u otras aplicaciones — sin importar qué tema estés usando."
  faq2_q: "¿Funciona en móvil y escritorio?"
  faq2_a: "Sí. Navi+ AI Menu Builder está diseñado con enfoque móvil, con configuraciones separadas para móvil y escritorio. Puedes mostrar una Tab Bar en móvil y un Mega Menu en escritorio — completamente independiente."
  faq3_q: "No estoy en Shopify. ¿Puedo seguir usando Navi+ AI Menu Builder?"
  faq3_a: "Sí. Navi+ AI Menu Builder funciona en cualquier sitio web a través de un simple código incrustado. Crea una cuenta gratuita en dash.naviplus.app, añade el fragmento a tu WordPress, Wix, Webflow o cualquier sitio, y estás listo."
  faq4_q: "¿Ralentizará mi tienda?"
  faq4_a: "No. Navi+ AI Menu Builder utiliza un CDN global con servidores edge en 6 continentes y es confiado por 5,000+ comerciantes sin latencia. Está diseñado para ser extremadamente ligero y continuamente optimizado para el rendimiento."
  faq5_q: "¿Qué está incluido en el plan gratuito?"
  faq5_a: "El plan gratuito incluye uso de por vida, 1 menú, 50,000 vistas/mes, todas las funciones principales y soporte por correo electrónico — sin anuncios. Los planes pagos comienzan en $6.25/mes para más menús, límites de vista más altos y soporte 24/7."
  faq6_q: "¿Necesito saber programar?"
  faq6_a: "Para nada. Navi+ AI Menu Builder es totalmente de arrastrar y soltar. Elige una plantilla, personaliza colores e iconos y publica — no se requieren habilidades de diseño o técnicas. Los usuarios avanzados pueden agregar CSS, HTML o JavaScript personalizado si quieren ir más lejos."
