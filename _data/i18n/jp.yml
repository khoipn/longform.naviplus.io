        a: "ほとんどの高度な機能はエディター内に表示されるため、メニュー構成のイメージを確認できます。たとえば Starter でも画像アップロード項目が見える場合がありますが、プレミアム専用部分はグレー表示または制限されます。完全な体験を安全に試すには、有料プランにアップグレードして 7 日間無料トライアルをご利用ください。トライアル期間中は料金は発生しません。"
      - q: "どのプランから始めるべきですか？"
        a: "Navi+ AI Menu Builder メニュー 1 つで体験を確認したい場合は Starter から始めてください。より多くのメニュー、画像アップロード、多言語対応、分析、高度なインタラクションが必要なら Business が適しています。ナビゲーションがストアの中心的な要素になり、無制限利用、SEO サポート、プレミアム CDN、ハンズオン支援が必要な場合は Elite を選んでください。"
      - q: "Starter または Business がビュー上限に達するとどうなりますか？"
        a: "Starter は最大 50,000 Navi+ AI Menu Builder ビュー、Business は月間最大 500,000 Navi+ AI Menu Builder ビューまで含まれます。上限に達した場合、まずメールで通知します。同じ状況が繰り返される場合、訪問者体験に影響しない小さな広告をメニューの隅に表示することがあります。重要：お客様の顧客に影響するため、Navi+ AI Menu Builder がメニューを非表示にすることはありません。"
      - q: "Business または Elite をリスクなく試すには？"
        a: "7 日間無料トライアルで、実際のメニュー公開、プレミアムインタラクション、画像アップロード、分析を支払い前に試せます。Navi+ AI Menu Builder が合わない場合は、トライアル終了前にキャンセルすれば請求されません。"
      - q: "後でダウングレードするとメニューは失われますか？"
        a: "いいえ。設定は保存されます。下位プランで維持できない有効機能がある場合 — たとえば追加メニュー、画像アップロード、多言語、高度なインタラクション、Elite 専用 SEO など — どれを有効に残すかを選べます。作業内容が突然失われることはありません。"
      - q: "Elite はどのような場合に Business より適していますか？"
        a: "メニュー数、ビュー数、高度な画像ツール、SEO Search optimization、より強力なグローバル CDN フェイルオーバー、広告なし、Navi+ AI Menu Builder チームによるハンズオン支援など、上限を外したい場合は Elite が適しています。ナビゲーションが単なる小さな追加機能ではなく、ストアの中心になっている場合に最適です。"
      - q: "Navi+ AI Menu Builder は他の有料アプリを置き換えられますか？"
        a: "多くの場合、可能です。Navi+ AI Menu Builder はプレミアムナビゲーションテーマ、メニュービルダー、フローティング連絡ボタン、カート/検索アイコンツール、チャットバブル置き換え機能の一部を代替できます。Business は月額 $6.25 からなので、複数の小さなアプリを組み合わせるより低コストになりやすいです。"
      - q: "Navi+ AI Menu Builder は Shopify 以外でも使えますか？"
        a: "はい。dash.naviplus.app で無料アカウントを作成し、埋め込みスニペットを取得して WordPress、Wix、Webflow、または任意の Web サイトに貼り付けるだけです。同じプラン構成と Navi+ AI Menu Builder エディターを利用できます。"
  cta:
    title: "無料で始めて、ナビゲーションの成長に合わせてアップグレード。"
    subtitle: "まずは 1 つのメニューを無料で使い、ストアに必要になったタイミングで、より多くのメニュー、ビュー、リッチメディア、分析、手厚いサポートへ拡張できます。"
