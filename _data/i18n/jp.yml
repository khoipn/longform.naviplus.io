  faq_title: "始める前に"
  faq1_q: "Navi+でサイトが遅くなりませんか？"
  faq1_a: "なりません。Navi+は6大陸にエッジサーバーを持つグローバルCDNで動作し、5,000以上のマーチャントが利用しています。通常のページ読み込みへの影響は10ms未満で、継続的にパフォーマンスが最適化されています。"
  faq2_q: "Navi+は信頼できますか？稼働保証はありますか？"
  faq2_a: "全プランは99.00% SLAの高品質インフラで動作します。EliteプランはCloudflare + BunnyCDNフェイルオーバーで99.99% SLAに対応。Navi+は中断なく何百万ものリクエストを処理してきました。"
  faq3_q: "どのくらい早く公開できますか？"
  faq3_a: "ほとんどのストアは5分以内に公開できます。Shopify App Storeからインストール（または他のプラットフォームへの埋め込みコードを貼り付け）し、テンプレートを選んで公開するだけ。コード不要、テーマ編集不要。"
  faq4_q: "コーディングの知識は必要ですか？"
  faq4_a: "まったく不要です。Navi+は完全なドラッグ＆ドロップ操作です。テンプレートを選び、色やアイコンをカスタマイズして公開するだけ。上級者はカスタムCSSやHTMLも追加できます。"
  faq5_q: "無料プランはありますか？"
  faq5_a: "あります。Starterプランは永久無料です — 1メニュー、月50,000ビュー、すべての基本機能、クレジットカード不要。必要になったときだけアップグレードしてください。"
