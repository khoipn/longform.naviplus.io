why_navi_page:
  seo_title: "なぜ Navi+？— プロフェッショナルなナビゲーションメニューの7つの基準 | Navi+"
  seo_desc: "デフォルトのテーマはフラットなテキストバーを提供します。Navi+ はプロのナビゲーションメニューが満たすべき7つの基準をすべてクリアします。"
  hero_tag: "デザイン & インターフェース"
  problem_intro: "運が良ければ、訪問者はサイトに着いた最初の数秒で必要なものを見つけます。しかしそうでない場合—そして現実的にほとんどの訪問ではそうなります—最初に目を向け、最初にクリックするのはナビゲーションメニューです。"
  p1_title: "メニューがシンプルすぎる"
  p1_desc: "テーマはフラットなテキストバーしか提供しません。画像なし、グループ化なし、ガイダンスなし。訪問者は見ても何を売っているかわからず—離れていきます。"
  p2_title: "変えたいが、どこから始めればいいかわからない"
  p2_desc: "メニューの改善が必要とわかっています。でもテーマは複雑で、アプリは競合リスクがあり、開発者はコストがかかります。明確な前進の道がありません。"
  p3_title: "長期間の管理・維持が困難"
  p3_desc: "テーマを変えると全て失います。アップグレードはリスクを伴います。季節バナーの変更も開発者が必要です。本来最も主体的であるべきメニューが、最もコントロールできないものになっています。"
  criteria_label: "プロの基準"
  criteria_title: "プロフェッショナルなメニューに求めるべき7つのこと"
  criteria_lead: "メニューはウェブサイト上でユーザーが最も頻繁に操作する2番目の要素（「カートに追加」の次）です。以下が期待すべきことです："
  c1_title: "多用途—そしてストーリーを語る"
  c1_desc: "すべてのスタイルを含む必要があります：デスクトップ用メガメニュー、モバイル用タブバー、クリーンなハンバーガー用スライドメニュー、緊急アクション用FAB、ランディングページ用グリッドメニュー。より重要なのは：メニューはカテゴリを並べるだけでなく、購買旅程をガイドする必要があります。"
  c2_title: "互換性—競合なし"
  c2_desc: "サイトの他の部分と平和的に共存する必要があります。カートを隠さず、検索パネルを壊さず、チャットウィジェットと重ならない。テーマを変更しても何も失われません—メニューはテーマとは独立して存在する必要があります。"
  c3_title: "高速で非常に信頼性が高い"
  c3_desc: "メニューは決して「死んで」はいけません。十分に速く読み込み、低速接続でも動作し、メインページのレンダリングをブロックしてはなりません。あらゆるデバイスで、いつでも準備ができているコンポーネントです。"
  c4_title: "測定可能—個々のアイテムレベルまで"
  c4_desc: "各アイテムが何回表示（インプレッション）され、何回クリックされたかを追跡する必要があります。Googleアナリティクスではこれができません。このデータなしでは、メニューのあらゆる変更は推測に過ぎません。"
  c5_title: "サイト上の他のアプリとの統合"
  c5_desc: "検索ボックス、カートパネル、チャットウィジェットを開けるようにする必要があります。あらゆるアプリと統合するためのJavaScript呼び出しをサポートする必要があります。モダンなメニューは中央コントロールポイントであり、静的な目次ではありません。"
  c6_title: "多言語・マルチマーケット"
  c6_desc: "Shopify Markets、WordPressの多言語と統合し、各市場に適切な通貨とラベルを表示する必要があります。これはプレミアム機能ではなく、標準です。"
  c7_title: "独立—開発者不要"
  c7_desc: "あなた—サイトオーナー—が必要なときにメニューを変更できなければなりません。セール、新コレクション発売、マーケティング戦略変更、A/Bテスト—すべてドラッグ＆ドロップで実現でき、開発者もデプロイも不要である必要があります。"
  solution_label: "ソリューション"
  solution_title: "Navi+ メニュービルダー — 7つの基準すべてを解決"
  solution_lead: "Navi+ は<strong>ノーコードメニュービルダー</strong>—テーマに触れたり、一行もコードを書かずに、あらゆるウェブサイト向けの美しい高コンバージョンメニューを作成できます。"
  how_heading: "Navi+ の仕組み"
  how_desc: "Navi+ は<strong style=\"color:#0f1117;\">ウィジェット</strong>—既存のテーマを置き換えたり変更したりしません。すべてダッシュボードから管理されます。変更は即座に反映されます。"
  s1_title: "ダッシュボードでメニューを構築"
  s1_desc: "ドラッグ＆ドロップ、コード不要。完全にコントロールできます。"
  s2_title: "一度だけ埋め込む"
  s2_desc: "Shopifyのアプリブロック、またはその他プラットフォームのスニペット。"
  s3_title: "メニューがサイト上でレンダリング—テーマ独立"
  s3_desc: "テーマを何度変えてもメニューはそのまま。即座に公開。"
  speed_badge: "Cloudflare CDN経由で配信 · 平均読み込み時間<span>~52ms</span>"
  platforms_label: "あらゆるプラットフォームで動作"
  platform_any: "あらゆるウェブサイト"
  not_label: "Navi+ は〇〇ではありません"
  not1: "<strong style=\"color:#0f1117;\">テーマではありません</strong>—既存のテーマと並行して動作し、置き換えません。"
  not2: "<strong style=\"color:#0f1117;\">手動インストール不要</strong>—アプリブロック（Shopify）、プラグイン（WordPress）、またはスニペット一つで十分です。"
  not3: "<strong style=\"color:#0f1117;\">サイトを壊しません</strong>—Navi+が無効にされると、テーマの元のメニューが自動的に戻ります。"
  feats_label: "主な機能"
  f1_title: "1つのアプリで5種類のメニュー"
  f1_desc: "メガメニュー · タブバー · スライドメニュー · FAB · グリッドメニュー。必要に応じて組み合わせ、ドラッグ＆ドロップで設計。"
  f2_title: "テーマ独立"
  f2_desc: "テーマを何度変えてもメニューを失いません。設定はダッシュボードに独立して保存されます。"
  f3_title: "アイテムごとの分析"
  f3_desc: "各アイテムのインプレッション · クリック · CTR。他のほとんどのメニュービルダーにはない機能。"
  f4_title: "深いサイト統合"
  f4_desc: "カートパネル · 検索ボックス · チャットウィジェット · JavaScript APIを呼び出す。静的リンクだけではありません。"
  f5_title: "多言語 & Shopify Markets"
  f5_desc: "一度設定すれば、メニューは各市場に適切な言語と通貨を自動表示します。"
  f6_title: "条件付き表示"
  f6_desc: "デバイス · URL · 顧客ステータス · 言語別。すべてコード不要。"
  f7_title: "完全な自律性"
  f7_desc: "セール？2分でバナーを更新。新商品発売？今すぐ公開。開発者不要。"
  f8_title: "本物のサポート"
  f8_desc: "ダッシュボード内のライブチャット、数分以内に返信。Navi+ Careがデザインをお手伝いします。"
