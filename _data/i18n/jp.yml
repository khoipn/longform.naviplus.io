  faq_label: "よくある質問"
  faq_title: "よくある質問"
  faq1_q: "Navi+ AI Menu Builder は既存のテーマと競合しますか?"
  faq1_a: "いいえ。Navi+ AI Menu Builder は外部 JavaScript ライブラリなしで、純粋な HTML5 と CSS3 で構築されています。つまり、使用しているテーマに関わらず、テーマや他のアプリとの競合がありません。"
  faq2_q: "モバイルとデスクトップの両方で機能しますか?"
  faq2_a: "はい。Navi+ AI Menu Builder はモバイルファーストで設計され、モバイルとデスクトップで独立した設定があります。モバイルでは Tab Bar、デスクトップでは Mega Menu を表示できます。完全に独立しています。"
  faq3_q: "Shopify を使用していません。Navi+ AI Menu Builder は使用できますか?"
  faq3_a: "はい。Navi+ AI Menu Builder はシンプルな埋め込みコードで任意のウェブサイトで動作します。dash.naviplus.app で無料アカウントを作成し、スニペットを WordPress、Wix、Webflow、またはその他のサイトに追加すれば準備完了です。"
  faq4_q: "ストアが遅くなりますか?"
  faq4_a: "いいえ。Navi+ AI Menu Builder は 6 つの大陸にエッジサーバーを持つグローバル CDN を使用しており、5,000+ マーチャントに信頼されており、レイテンシはありません。極めて軽量に設計されており、パフォーマンスのために継続的に最適化されています。"
  faq5_q: "無料プランに含まれるもの何ですか?"
  faq5_a: "無料プランには、永続的な使用、1 つのメニュー、月 50,000 ビュー、すべてのコア機能、メールサポートが含まれます。広告はありません。有料プランは月 $6.25 から始まり、より多くのメニュー、高いビュー制限、24/7 サポートを提供します。"
  faq6_q: "コーディングができる必要がありますか?"
  faq6_a: "全くありません。Navi+ AI Menu Builder は完全なドラッグアンドドロップです。テンプレートを選択し、色とアイコンをカスタマイズして公開するだけです。デザインや技術的なスキルは必要ありません。上級ユーザーは、さらに進めたい場合はカスタム CSS、HTML、または JavaScript を追加できます。"
  platform_label: "始める"
  platform_title: "プラットフォームを\n選択する。"
  platform_sub: "同じ機能、同じ価格。ストアに合ったパスを選択してください。"
