  how_sub: "Sem designers, sem desenvolvedores, sem edições de tema. Navi+ AI Menu Builder se encaixa perfeitamente na sua loja existente sem tocar em uma única linha de código."
  step1_title: "Instalar Navi+ AI Menu Builder"
  step1_body: "Adicione o app da Shopify App Store — ou cole um simples snippet de código em WordPress, Wix ou qualquer plataforma. Plano gratuito disponível, nenhum cartão de crédito necessário."
  step2_title: "Escolha um modelo"
  step2_body: "Escolha entre 20+ layouts de navegação pré-projetados. Tab bar para mobile, mega menu para desktop, slide menu para qualquer tela. Cada modelo é totalmente personalizável."
  step3_title: "Publique e guie visitantes"
  step3_body: "Arraste, solte e configure. Seu novo menu vai ao ar instantaneamente — ultra rápido via CDN edge em 6 continentes, tratando milhões de solicitações sem desacelerar sua loja."
  navtypes_label: "Tipos de navegação"
  navtypes_title: "Construído para cada tela"
  navtypes_sub: "Cada tipo de navegação serve a um propósito diferente — configure-os independentemente para mobile e desktop a partir de um único painel."
  mega_menu_desc: "Exibe um menu suspenso rico com colunas, imagens e links em destaque. Perfeito para lojas com grandes catálogos — guie os compradores diretamente para a categoria certa sem sobrecarregá-los."
  tab_bar_desc: "Uma barra de navegação fixa na parte inferior para mobile — assim como apps nativos. Coloca suas páginas mais importantes a um toque de distância, aumentando o engajamento e reduzindo a taxa de rejeição."
  slide_menu_desc: "Um painel deslizável suave que revela sua navegação completa sem sair da página. Ideal para lojas mobile-first que desejam uma experiência de navegação limpa e sem distrações."
  sticky_navbar_desc: "Uma barra de navegação superior que permanece visível enquanto os visitantes rolam. Mantém sua marca, busca e carrinho sempre acessíveis — reduzindo o atrito e aumentando conversões."
