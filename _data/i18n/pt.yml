  faq_label: "FAQ"
  faq_title: "Perguntas comuns"
  faq1_q: "Navi+ AI Menu Builder entrará em conflito com meu tema existente?"
  faq1_a: "Não. Navi+ AI Menu Builder é construído com HTML5 e CSS3 puro, sem bibliotecas JavaScript externas. Isso significa zero conflitos com seu tema ou outros apps — independentemente de qual tema você está usando."
  faq2_q: "Funciona em mobile e desktop?"
  faq2_a: "Sim. Navi+ AI Menu Builder é projetado mobile-first, com configurações separadas para mobile e desktop. Você pode mostrar uma Tab Bar no mobile e um Mega Menu no desktop — completamente independente."
  faq3_q: "Não estou no Shopify. Ainda posso usar Navi+ AI Menu Builder?"
  faq3_a: "Sim. Navi+ AI Menu Builder funciona em qualquer site através de um simples código de incorporação. Crie uma conta gratuita em dash.naviplus.app, adicione o snippet ao seu WordPress, Wix, Webflow ou qualquer site, e você está pronto."
  faq4_q: "Isso vai desacelerar minha loja?"
  faq4_a: "Não. Navi+ AI Menu Builder usa um CDN global com servidores edge em 6 continentes e é confiado por 5,000+ comerciantes sem latência. É projetado para ser extremamente leve e continuamente otimizado para desempenho."
  faq5_q: "O que está incluído no plano gratuito?"
  faq5_a: "O plano gratuito inclui uso vitalício, 1 menu, 50,000 visualizações/mês, todos os recursos principais e suporte por email — sem anúncios. Planos pagos começam em $6.25/mês para mais menus, limites de visualização mais altos e suporte 24/7."
  faq6_q: "Preciso saber programar?"
  faq6_a: "De jeito nenhum. Navi+ AI Menu Builder é totalmente arrastar e soltar. Escolha um modelo, personalize cores e ícones e publique — nenhuma habilidade de design ou técnica necessária. Usuários avançados podem adicionar CSS, HTML ou JavaScript personalizado se quiserem ir além."
