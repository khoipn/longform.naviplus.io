  enterprise:
    title: "Precisa de um plano custom para agência ou enterprise?"
    body: "Fale conosco sobre volume pricing, opções white-label e suporte dedicado."
  faq:
    title: "FAQ de preços"
    subtitle: "Tudo que você precisa saber antes de escolher um plano."
    items:
      - q: "Quero testar recursos Premium. O que devo fazer?"
        a: "A maioria dos recursos avançados fica visível no editor para você entender a estrutura do menu. Por exemplo, upload de imagens pode aparecer no Starter, mas partes Premium ficam em cinza ou limitadas. Para testar tudo com segurança, faça upgrade para um plano pago e use o trial grátis de 7 dias — você não paga nada durante o trial."
      - q: "Com qual plano devo começar?"
        a: "Comece com Starter se precisar de apenas um menu Navi+ AI Menu Builder. Escolha Business para mais menus, upload de imagens, multilíngue, analytics e interações avançadas. Escolha Elite quando a navegação for central para sua loja e você quiser uso ilimitado, SEO, CDN premium e ajuda hands-on."
      - q: "O que acontece se Starter ou Business atingir o limite de views?"
        a: "Starter inclui até 50,000 Navi+ AI Menu Builder views, e Business até 500,000 Navi+ AI Menu Builder views por mês. Ao atingir o limite, você recebe um email de aviso primeiro. Se ocorrer repetidamente, podemos colocar um pequeno anúncio no canto do menu sem afetar a experiência do visitante. Importante: nunca escondemos seu menu."
      - q: "Como testar Business ou Elite sem risco?"
        a: "Use o trial grátis de 7 dias para publicar menus reais, testar interações premium, subir imagens e verificar analytics antes de pagar. Se Navi+ AI Menu Builder não servir, cancele antes do fim do trial."
      - q: "Vou perder meus menus se fizer downgrade?"
        a: "Não. Suas configurações são salvas. Se o plano inferior não puder manter todos os recursos ativos, você escolhe o que continua ativo em vez de perder seu trabalho."
      - q: "Quando Elite é melhor que Business?"
        a: "Escolha Elite quando quiser remover limites: menus ilimitados, views ilimitadas, ferramentas avançadas de imagem, SEO Search optimization, failover CDN global mais forte, nunca anúncios e ajuda hands-on."
      - q: "Navi+ AI Menu Builder pode substituir outros apps pagos?"
        a: "Muitas vezes, sim. Navi+ AI Menu Builder pode substituir partes de temas premium de navegação, menu builders, botões flutuantes de contato, ferramentas cart/search icon e chat bubble replacements."
      - q: "Navi+ AI Menu Builder funciona fora do Shopify?"
        a: "Sim. Crie uma conta grátis em dash.naviplus.app, copie o embed snippet e cole no WordPress, Wix, Webflow ou qualquer site."
