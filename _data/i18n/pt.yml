why_navi_page:
  seo_title: "Por que Navi+? — 7 critérios para um menu de navegação profissional | Navi+"
  seo_desc: "O tema padrão te dá uma barra de texto plana. O Navi+ resolve todos os 7 critérios que um menu de navegação profissional precisa atender."
  hero_tag: "Design & Interface"
  problem_intro: "Com sorte, os visitantes encontram o que precisam nos primeiros segundos de chegada ao seu site. Mas quando isso não acontece — e na realidade é assim na maioria das visitas — o primeiro lugar onde eles olham, a primeira coisa que clicam, é o menu de navegação."
  p1_title: "Seu menu é simples demais"
  p1_desc: "Seu tema te dá uma barra de texto plana. Sem imagens, sem agrupamento, sem orientação. Os visitantes olham, não entendem o que você vende — e saem."
  p2_title: "Quer mudar, mas não sabe por onde começar"
  p2_desc: "Você sabe que o menu precisa melhorar. Mas o tema é confuso, apps têm risco de conflitos, desenvolvedores custam caro. Não há um caminho claro a seguir."
  p3_title: "Difícil de controlar e manter ao longo do tempo"
  p3_desc: "Trocar de tema significa perder tudo. Atualizar é arriscar. Até trocar um banner sazonal requer um desenvolvedor. Seu menu — o que deveria ser o mais fácil de controlar — é o que você menos controla."
  criteria_label: "Padrões Profissionais"
  criteria_title: "Estes são os 7 requisitos de um menu de navegação profissional"
  criteria_lead: "O menu é o segundo elemento mais interagido em qualquer site (depois do botão \"Adicionar ao carrinho\"). Aqui está o que você deve exigir:"
  c1_title: "Versátil — e conta uma história"
  c1_desc: "Deve incluir todos os estilos: Mega Menu para desktop, Tab Bar para mobile, Slide Menu para um hamburger limpo, FAB para ações urgentes, Grid Menu para landing pages. Mais importante: o menu deve guiar a jornada de compra, não apenas listar categorias."
  c2_title: "Compatível — sem conflitos"
  c2_desc: "Deve coexistir com o resto do seu site. Sem esconder o carrinho, sem quebrar o painel de busca, sem sobrepor o widget de chat. Ao trocar de tema, nada se perde — o menu existe independentemente do tema."
  c3_title: "Rápido e extremamente confiável"
  c3_desc: "O menu nunca pode \"morrer\". Deve carregar rápido, funcionar com conexões lentas e nunca bloquear o renderizamento da página principal. É o componente que deve estar sempre pronto — em qualquer dispositivo, a qualquer hora."
  c4_title: "Mensurável — até o nível de cada item"
  c4_desc: "Deve rastrear quantas vezes cada item foi exibido (impressões) e quantas vezes foi clicado. O Google Analytics não consegue fazer isso. Sem esses dados, toda mudança no menu é apenas suposição."
  c5_title: "Integração com outros apps do site"
  c5_desc: "Deve poder abrir a barra de pesquisa, o painel do carrinho e o widget de chat. Deve suportar chamadas JavaScript para integrar com qualquer app. Um menu moderno é um ponto central de controle — não um sumário estático."
  c6_title: "Multilíngue e multi-mercado"
  c6_desc: "Deve integrar com o Shopify Markets, WordPress multilíngue, e exibir a moeda e os rótulos corretos para cada mercado. Isso é um padrão, não um recurso premium."
  c7_title: "Independente — sem necessidade de desenvolvedor"
  c7_desc: "Você — o proprietário do site — deve poder alterar o menu quando precisar. Temporada de saldos, lançamento de nova coleção, mudança de estratégia de marketing, A/B test — tudo deve ser feito via arrastar e soltar, sem desenvolvedor, sem deployment."
  solution_label: "Solução"
  solution_title: "Navi+ AI Menu Builder — resolve todos os 7 critérios"
  solution_lead: "O Navi+ é um <strong>construtor de menus sem código</strong> — para criar menus bonitos e de alta conversão para qualquer site sem tocar no tema ou escrever uma linha de código."
  how_heading: "Como o Navi+ funciona"
  how_desc: "O Navi+ é um <strong style=\"color:#0f1117;\">widget</strong> — não substitui nem modifica seu tema existente. Tudo é gerenciado pelo dashboard. As mudanças vão ao ar instantaneamente."
  s1_title: "Crie seu menu no dashboard"
  s1_desc: "Arraste e solte, sem código. Você tem controle total."
  s2_title: "Incorpore uma única vez"
  s2_desc: "App Block no Shopify ou um snippet nas outras plataformas."
  s3_title: "O menu é renderizado no seu site — independente do tema"
  s3_desc: "Troque de tema quantas vezes quiser, seu menu permanece intacto. Publicação instantânea."
  speed_badge: "Entregue via Cloudflare CDN · <span>~52ms</span> de tempo médio de carregamento"
  platforms_label: "Funciona com qualquer plataforma"
  platform_any: "Qualquer site"
  not_label: "Navi+ NÃO é"
  not1: "<strong style=\"color:#0f1117;\">Não é um tema</strong> — funciona em paralelo com seu tema atual, não o substitui."
  not2: "<strong style=\"color:#0f1117;\">Sem instalação manual</strong> — um App Block (Shopify), plugin (WordPress) ou um snippet é suficiente."
  not3: "<strong style=\"color:#0f1117;\">Não pode quebrar seu site</strong> — se o Navi+ for desativado, o menu original do tema volta automaticamente."
  feats_label: "Recursos Principais"
  f1_title: "5 tipos de menu em um único app"
  f1_desc: "Mega Menu · Tab Bar · Slide Menu · FAB · Grid Menu. Combine conforme a necessidade, projete via arrastar e soltar."
  f2_title: "Independente do tema"
  f2_desc: "Troque de tema quantas vezes quiser sem perder seu menu. A configuração é salva independentemente no dashboard."
  f3_title: "Analytics por item"
  f3_desc: "Impressões · Cliques · CTR para cada item. Um recurso que quase nenhum outro construtor de menus oferece."
  f4_title: "Integração profunda com o site"
  f4_desc: "Abra painel do carrinho · busca · chat · JavaScript API. Não apenas links estáticos."
  f5_title: "Multilíngue & Shopify Markets"
  f5_desc: "Configure uma vez, o menu exibe automaticamente o idioma e a moeda corretos para cada mercado."
  f6_title: "Exibição condicional"
  f6_desc: "Por dispositivo · URL · status do cliente · idioma. Tudo sem código."
  f7_title: "Autonomia total"
  f7_desc: "Temporada de saldos? Atualize o banner em 2 minutos. Lançamento de produto? Publique agora. Sem desenvolvedor."
  f8_title: "Suporte real"
  f8_desc: "Chat ao vivo no dashboard, respostas em minutos. O Navi+ Care está pronto para criar para você."
