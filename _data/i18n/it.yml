  step1_title: "Installa Navi+ AI Menu Builder"
  step1_body: "Aggiungi l'app dallo Shopify App Store — o incolla un semplice snippet di codice su WordPress, Wix, o qualsiasi piattaforma. Piano gratuito disponibile, nessuna carta di credito richiesta."
