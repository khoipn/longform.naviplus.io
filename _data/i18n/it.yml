  faq_label: "Domande frequenti"
  faq_title: "Prima di iniziare"
  faq1_q: "Navi+ rallenterà il mio sito web?"
  faq1_a: "No. Navi+ funziona su una CDN globale con server in 6 continenti, utilizzato da oltre 5.000 merchant. Di solito aggiunge meno di 10 ms al caricamento e viene continuamente ottimizzato."
  faq2_q: "Navi+ è affidabile? C'è una garanzia di uptime?"
  faq2_a: "Tutti i piani funzionano su infrastruttura di alta qualità con SLA al 99,00 %. I piani Elite passano a Cloudflare + BunnyCDN per SLA al 99,99 %. Navi+ ha gestito milioni di richieste senza interruzioni."
  faq3_q: "In quanto tempo posso andare live?"
  faq3_a: "La maggior parte dei negozi va live in meno di 5 minuti. Installa dall'App Store di Shopify (o incolla uno snippet), scegli un template e pubblica — nessun codice, nessuna modifica al tema."
  faq4_q: "Devo saper programmare?"
  faq4_a: "Assolutamente no. Navi+ è completamente drag-and-drop. Scegli un template, personalizza colori e icone e pubblica. Gli utenti avanzati possono aggiungere CSS o HTML personalizzato."
  faq5_q: "C'è un piano gratuito?"
  faq5_a: "Sì. Il piano Starter è gratuito per sempre — 1 menu, 50.000 visualizzazioni/mese, tutte le funzionalità di base, nessuna carta di credito. Aggiorna solo quando ne hai bisogno."
  coming_soon_name: "Prossimamente"
  coming_soon_desc: "Sviluppiamo continuamente nuovi tipi di menu per migliorare la navigazione del tuo sito."
  platform_other_name: "Qualsiasi sito web"
  platform_other_desc: "Compatible con Wix, Squarespace, Webflow o qualsiasi sito web. Aggiungi un snippet e il tuo menu Navi+ è live — nessuna restrizione di piattaforma."
  platform_other_cta: "Crea account gratuito →"
  speed_label: "Prestazioni"
  speed_title: "Leggerissimo.\nVelocissimo."
  speed_1_title: "Installa. Rimuovi. Senza tracce."
  speed_1_body: "Uno snippet per installare, un clic per rimuovere. Nessuna modifica al tema, nessun codice residuo, nessun vincolo."
  speed_2_title: "Distribuito dall'edge, non dai nostri server."
  speed_2_body: "Il tuo menu si carica dai nodi Cloudflare e BunnyCDN nel mondo. Nessun backend nel percorso critico — rimane veloce anche se i nostri server vanno giù."
  speed_3_title: "Accelerato dall'IA, per impostazione predefinita."
  speed_3_body: "Genera menu, scrivi descrizioni e ottimizza la navigazione con l'IA. Ogni flusso di lavoro è accelerato dall'IA per lavorare più velocemente."


why_navi_page:
  seo_title: "Perché Navi+? — 7 criteri per un menu di navigazione professionale | Navi+"
  seo_desc: "Il tema predefinito ti dà una barra di testo piatta. Navi+ soddisfa tutti e 7 i criteri che un menu di navigazione professionale deve rispettare."
  hero_tag: "Design & Interfaccia"
  problem_intro: "Se sei fortunato, i visitatori trovano ciò di cui hanno bisogno nei primi secondi dall'arrivo sul tuo sito. Ma quando ciò non accade — e nella realtà è così per la maggior parte delle visite — il primo posto dove guardano, la prima cosa che cliccano, è il menu di navigazione."
  p1_title: "Il tuo menu è troppo semplice"
  p1_desc: "Il tuo tema ti dà una barra di testo piatta. Nessuna immagine, nessun raggruppamento, nessuna guida. I visitatori guardano e non capiscono cosa vendi — e se ne vanno."
  p2_title: "Vuoi cambiare, ma non sai da dove iniziare"
  p2_desc: "Sai che il menu deve migliorare. Ma il tema è complicato, le app rischiano conflitti, i developer costano. Non c'è un percorso chiaro da seguire."
  p3_title: "Difficile da controllare e mantenere nel tempo"
  p3_desc: "Cambiare tema significa perdere tutto. Aggiornare significa rischiare. Anche cambiare un banner stagionale richiede un developer. Il tuo menu — quello che dovresti padroneggiare — è quello su cui hai meno controllo."
  criteria_label: "Standard Professionali"
  criteria_title: "Questi sono i 7 requisiti di un menu professionale"
  criteria_lead: "Il menu è il secondo elemento più interagito su qualsiasi sito web (dopo il pulsante \"Aggiungi al carrello\"). Ecco cosa dovresti aspettarti:"
  c1_title: "Versatile — e racconta una storia"
  c1_desc: "Deve includere ogni stile: Mega Menu per desktop, Tab Bar per mobile, Slide Menu per un hamburger ordinato, FAB per azioni urgenti, Grid Menu per landing page. Ancora più importante: il menu deve guidare il percorso d'acquisto, non solo elencare categorie."
  c2_title: "Compatibile — nessun conflitto"
  c2_desc: "Deve coesistere con il resto del tuo sito. Senza nascondere il carrello, senza rompere il pannello di ricerca, senza sovrapporsi al widget chat. Quando cambi tema, non perdi nulla — il menu esiste indipendentemente dal tema."
  c3_title: "Veloce ed estremamente affidabile"
  c3_desc: "Il menu non deve mai \"morire\". Deve caricare velocemente, funzionare con connessioni lente e non bloccare mai il rendering della pagina principale. È il componente che deve essere sempre pronto — su qualsiasi dispositivo, in qualsiasi momento."
  c4_title: "Misurabile — fino al singolo item"
  c4_desc: "Deve tracciare quante volte ogni item viene mostrato (impressioni) e quante volte viene cliccato. Google Analytics non può farlo. Senza questi dati, ogni cambiamento al menu è solo un'ipotesi."
  c5_title: "Integrazione con le altre app del sito"
  c5_desc: "Deve poter aprire la casella di ricerca, il pannello carrello e il widget chat. Deve supportare chiamate JavaScript per integrarsi con qualsiasi app. Un menu moderno è un punto di controllo centrale — non un indice statico."
  c6_title: "Multilingua e multi-mercato"
  c6_desc: "Deve integrarsi con Shopify Markets, il multilingua WordPress, e mostrare la valuta e le etichette corrette per ogni mercato. È uno standard, non una funzionalità premium."
  c7_title: "Indipendente — nessun developer necessario"
  c7_desc: "Tu — il proprietario del sito — devi poter modificare il menu quando ne hai bisogno. Stagione dei saldi, lancio di nuova collezione, cambio strategia marketing, A/B test — tutto deve essere realizzabile con drag-and-drop, senza developer, senza deployment."
  solution_label: "Soluzione"
  solution_title: "Navi+ AI Menu Builder — risolve tutti i 7 criteri"
  solution_lead: "Navi+ è un <strong>menu builder senza codice</strong> — per creare menu belli e ad alta conversione su qualsiasi sito senza toccare il tema o scrivere una riga di codice."
  how_heading: "Come funziona Navi+"
  how_desc: "Navi+ è un <strong style=\"color:#0f1117;\">widget</strong> — non sostituisce né modifica il tuo tema esistente. Tutto viene gestito dalla dashboard. Le modifiche vanno live istantaneamente."
  s1_title: "Crea il tuo menu nella dashboard"
  s1_desc: "Drag and drop, nessun codice necessario. Hai il pieno controllo."
  s2_title: "Incorpora una volta sola"
  s2_desc: "App Block su Shopify o uno snippet sulle altre piattaforme."
  s3_title: "Il menu si renderizza sul tuo sito — indipendente dal tema"
  s3_desc: "Cambia tema quante volte vuoi, il tuo menu rimane intatto. Pubblicazione istantanea."
  speed_badge: "Distribuito via Cloudflare CDN · <span>~52ms</span> di tempo di caricamento medio"
  platforms_label: "Funziona con ogni piattaforma"
  platform_any: "Qualsiasi sito web"
  not_label: "Navi+ NON è"
  not1: "<strong style=\"color:#0f1117;\">Non è un tema</strong> — funziona in parallelo con il tuo tema attuale, non lo sostituisce."
  not2: "<strong style=\"color:#0f1117;\">Nessuna installazione manuale</strong> — un App Block (Shopify), plugin (WordPress) o uno snippet è sufficiente."
  not3: "<strong style=\"color:#0f1117;\">Non può danneggiare il tuo sito</strong> — se Navi+ viene disabilitato, il menu originale del tema torna automaticamente."
  feats_label: "Funzionalità principali"
  f1_title: "5 tipi di menu in un'unica app"
  f1_desc: "Mega Menu · Tab Bar · Slide Menu · FAB · Grid Menu. Combina secondo le necessità, progetta con drag-and-drop."
  f2_title: "Indipendente dal tema"
  f2_desc: "Cambia tema quante volte vuoi senza perdere il menu. La configurazione è salvata indipendentemente nella dashboard."
  f3_title: "Analytics per singolo item"
  f3_desc: "Impressioni · Click · CTR per ogni item. Una funzionalità che quasi nessun altro menu builder offre."
  f4_title: "Integrazione profonda con il sito"
  f4_desc: "Apri carrello · ricerca · widget chat · JavaScript API. Non solo link statici."
  f5_title: "Multilingua & Shopify Markets"
  f5_desc: "Configura una volta, il menu mostra automaticamente lingua e valuta corrette per ogni mercato."
  f6_title: "Visualizzazione condizionale"
  f6_desc: "Per dispositivo · URL · stato cliente · lingua. Tutto senza codice."
  f7_title: "Piena autonomia"
  f7_desc: "Stagione dei saldi? Aggiorna il banner in 2 minuti. Lancio prodotto? Pubblica subito. Nessun developer."
  f8_title: "Supporto reale"
  f8_desc: "Chat live nella dashboard, risposte in pochi minuti. Navi+ Care è pronto a progettare per te."
