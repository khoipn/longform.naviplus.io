  faq_label: "FAQ"
  faq_title: "Domande comuni"
  faq1_q: "Navi+ AI Menu Builder entrerà in conflitto con il mio tema esistente?"
  faq1_a: "No. Navi+ AI Menu Builder è costruito con HTML5 e CSS3 puri, senza librerie JavaScript esterne. Ciò significa zero conflitti con il tuo tema o altre app — indipendentemente dal tema che stai usando."
  faq2_q: "Funziona su mobile e desktop?"
  faq2_a: "Sì. Navi+ AI Menu Builder è progettato mobile-first, con configurazioni separate per mobile e desktop. Puoi mostrare una Tab Bar su mobile e un Mega Menu su desktop — completamente indipendentemente."
  faq3_q: "Non sono su Shopify. Posso ancora usare Navi+ AI Menu Builder?"
  faq3_a: "Sì. Navi+ AI Menu Builder funziona su qualsiasi sito web tramite un semplice snippet di codice. Crea un account gratuito su dash.naviplus.app, aggiungi il snippet a WordPress, Wix, Webflow o qualsiasi sito, e sei pronto."
  faq4_q: "Rallenterà il mio negozio?"
  faq4_a: "No. Navi+ AI Menu Builder utilizza un CDN globale con server edge su 6 continenti ed è affidato da 5,000+ commercianti senza latenza. È progettato per essere estremamente leggero e continuamente ottimizzato per le prestazioni."
  faq5_q: "Cosa è incluso nel piano gratuito?"
  faq5_a: "Il piano gratuito include uso a vita, 1 menu, 50,000 visualizzazioni/mese, tutte le funzionalità principali e supporto via email — senza pubblicità. I piani a pagamento iniziano da $6.25/mese per più menu, limiti di visualizzazione più alti e supporto 24/7."
  faq6_q: "Devo sapere come programmare?"
  faq6_a: "Affatto. Navi+ AI Menu Builder è completamente drag-and-drop. Scegli un modello, personalizza colori e icone e pubblica — non servono abilità di design o tecniche. Gli utenti avanzati possono aggiungere CSS, HTML o JavaScript personalizzati se vogliono andare oltre."
  platform_label: "Inizia"
  platform_title: "Scegli la tua\npiattaforma."
  platform_sub: "Stesse funzioni, stessi prezzi. Scegli il percorso adatto al tuo negozio."
