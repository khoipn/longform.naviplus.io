  enterprise:
    title: "Serve un piano custom per agency o enterprise?"
    body: "Contattaci per volume pricing, opzioni white-label e supporto dedicato."
  faq:
    title: "FAQ prezzi"
    subtitle: "Tutto ciò che devi sapere prima di scegliere un piano."
    items:
      - q: "Voglio provare le funzionalità Premium. Cosa devo fare?"
        a: "La maggior parte delle funzioni avanzate è visibile nell’editor per aiutarti a capire la struttura del menu. Per esempio, l’upload immagini può comparire su Starter, ma le parti Premium saranno grigie o limitate. Per provare tutto in sicurezza, passa a un piano a pagamento e usa la prova gratuita di 7 giorni — non paghi nulla durante il trial."
      - q: "Con quale piano dovrei iniziare?"
        a: "Inizia con Starter se ti serve un solo menu Navi+ AI Menu Builder. Scegli Business per più menu, upload immagini, multilingua, analytics e interazioni avanzate. Scegli Elite quando la navigazione è centrale per il tuo store e vuoi uso illimitato, supporto SEO, CDN premium e aiuto hands-on."
      - q: "Cosa succede se Starter o Business raggiunge il limite di views?"
        a: "Starter include fino a 50,000 Navi+ AI Menu Builder views, Business fino a 500,000 Navi+ AI Menu Builder views al mese. Quando raggiungi il limite ricevi prima un’email di avviso. Se succede ripetutamente, possiamo mostrare un piccolo annuncio nell’angolo del menu senza influire sull’esperienza visitatore. Importante: non nascondiamo mai il tuo menu."
      - q: "Come posso testare Business o Elite senza rischi?"
        a: "Usa la prova gratuita di 7 giorni per pubblicare menu reali, testare interazioni premium, caricare immagini e controllare analytics prima di pagare. Se Navi+ AI Menu Builder non fa per te, cancella prima della fine del trial."
      - q: "Perderò i miei menu se faccio downgrade?"
        a: "No. Le configurazioni vengono salvate. Se il piano inferiore non può mantenere tutte le funzioni attive, scegli cosa resta attivo invece di perdere il lavoro."
      - q: "Quando Elite è meglio di Business?"
        a: "Scegli Elite quando vuoi rimuovere i limiti: menu illimitati, views illimitate, strumenti immagine avanzati, SEO Search optimization, failover CDN globale più forte, mai pubblicità e supporto hands-on."
      - q: "Navi+ AI Menu Builder può sostituire altre app a pagamento?"
        a: "Spesso sì. Navi+ AI Menu Builder può sostituire parti di temi navigation premium, menu builder, floating contact button, strumenti cart/search icon e chat bubble replacement."
      - q: "Navi+ AI Menu Builder funziona fuori da Shopify?"
        a: "Sì. Crea un account gratuito su dash.naviplus.app, copia l’embed snippet e incollalo in WordPress, Wix, Webflow o qualsiasi sito."
