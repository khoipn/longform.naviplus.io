  navtypes_label: "Tipi di navigazione"
  navtypes_title: "Progettato per ogni schermo"
  navtypes_sub: "Ogni tipo di navigazione serve uno scopo diverso — configurali indipendentemente per mobile e desktop da un'unica dashboard."
  mega_menu_desc: "Visualizza un menu a discesa ricco con colonne, immagini e link in evidenza. Perfetto per negozi con grandi cataloghi — guida gli acquirenti direttamente alla categoria giusta senza sopraccaricarli."
  tab_bar_desc: "Una barra di navigazione fissa in basso per mobile — proprio come le app native. Metti le tue pagine più importanti a portata di dito, aumentando l'engagement e riducendo il bounce rate."
  slide_menu_desc: "Un pannello scorrevole fluido che rivela la tua navigazione completa senza lasciare la pagina. Ideale per negozi mobile-first che vogliono un'esperienza di navigazione pulita e senza distrazioni."
  sticky_navbar_desc: "Una barra di navigazione superiore che rimane visibile mentre i visitatori scorrono. Mantiene il tuo brand, la ricerca e il carrello sempre accessibili — riducendo l'attrito e aumentando le conversioni."
