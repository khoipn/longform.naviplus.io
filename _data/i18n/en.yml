  speed_2_body: "Your menu loads from Cloudflare and BunnyCDN nodes worldwide. No backend server in the critical path — it stays fast even if our own servers are down."
  speed_3_title: "AI-accelerated, by default."
  speed_3_body: "Generate menus, write descriptions, and optimize navigation with AI. Every workflow has AI built in so you ship faster."


why_navi_page:
  seo_title: "Why Navi+? — 7 criteria for a professional navigation menu | Navi+"
  seo_desc: "Default themes give you a flat text bar. Navi+ solves all 7 criteria a professional navigation menu must meet."
  hero_tag: "Design & Interface"
  problem_intro: "Lucky visitors find what they need within the first few seconds of landing on your site. But when that doesn't happen — and realistically, most visits go this way — the first place they look, the first thing they click, is the navigation menu."
  p1_title: "Your menu is too simple"
  p1_desc: "Your theme gives you a flat text bar. No images, no grouping, no guidance. Visitors look at it, don't understand what you sell — and leave."
  p2_title: "Want to change, but don't know where to start"
  p2_desc: "You know the menu needs improving. But the theme is confusing, apps risk conflicts, developers cost money. There's no clear path forward."
  p3_title: "Hard to control and maintain over time"
  p3_desc: "Switch themes and lose everything. Upgrade and take a risk. Even a seasonal banner change requires a developer. Your menu — the thing you should own — is the thing you control least."
  criteria_label: "Professional Standards"
  criteria_title: "These are the 7 things you should demand from a professional menu"
  criteria_lead: "The menu is the second most interacted element on any website (after \"Add to cart\"). Here's what you should expect:"
  c1_title: "Versatile — and tells a story"
  c1_desc: "Must include every style: Mega Menu for desktop, Tab Bar for mobile, Slide Menu for a clean hamburger, FAB for urgent actions, Grid Menu for landing pages. More importantly: the menu must guide the purchase journey, not just list categories."
  c2_title: "Compatible — no conflicts"
  c2_desc: "Must coexist with the rest of your site. No hiding the cart, no breaking the search panel, no overlapping the chat widget. When you change themes, nothing is lost — the menu lives independently of your theme."
  c3_title: "Fast and extremely reliable"
  c3_desc: "The menu must never \"die.\" It must load fast, work on slow connections, and never block the main page from rendering. It's the component that must always be ready — on any device, at any time."
  c4_title: "Measurable — down to individual items"
  c4_desc: "Must track how many times each item was shown (impressions) and clicked. Google Analytics can't do this. Without this data, every menu change is just a guess."
  c5_title: "Integrates with other apps on your site"
  c5_desc: "Must be able to open the search box, cart panel, and chat widget. Must support JavaScript calls to integrate with any app. A modern menu is a central control point — not a static table of contents."
  c6_title: "Multilingual and multi-market"
  c6_desc: "Must integrate with Shopify Markets, multilingual WordPress, and display the correct currency and labels for each market. That's a standard, not a premium feature."
  c7_title: "Independent — no developer required"
  c7_desc: "You — the site owner — must be able to change the menu whenever needed. Sale season, new collection launch, marketing strategy shift, A/B testing — all must be doable via drag-and-drop, no developer, no deployment."
  solution_label: "Solution"
  solution_title: "Navi+ AI Menu Builder — solves all 7 criteria"
  solution_lead: "Navi+ is a <strong>no-code menu builder</strong> — helping you create beautiful, high-converting menus for any website without touching your theme or writing a single line of code."
  how_heading: "How Navi+ works"
  how_desc: "Navi+ is a <strong style=\"color:#0f1117;\">widget</strong> — it doesn't replace or modify your existing theme. Everything is managed from the dashboard. Changes go live instantly."
  s1_title: "Build your menu in the dashboard"
  s1_desc: "Drag and drop, no code needed. You're in full control."
  s2_title: "Embed once"
  s2_desc: "App Block on Shopify or a snippet on other platforms."
  s3_title: "Menu renders on your site — theme-independent"
  s3_desc: "Switch themes as many times as you like, your menu stays intact. Publish instantly."
  speed_badge: "Delivered via Cloudflare CDN · <span>~52ms</span> average load time"
  platforms_label: "Works with every platform"
  platform_any: "Any website"
  not_label: "Navi+ is NOT"
  not1: "<strong style=\"color:#0f1117;\">Not a theme</strong> — works alongside your existing theme, doesn't replace it."
  not2: "<strong style=\"color:#0f1117;\">No manual installation</strong> — one App Block (Shopify), plugin (WordPress), or a snippet is all it takes."
  not3: "<strong style=\"color:#0f1117;\">Can't break your site</strong> — if Navi+ is disabled, your theme's original menu automatically returns."
  feats_label: "Key Features"
  f1_title: "5 menu types in one app"
  f1_desc: "Mega Menu · Tab Bar · Slide Menu · FAB · Grid Menu. Mix and match by need, design via drag-and-drop."
  f2_title: "Theme-independent"
  f2_desc: "Switch themes as many times as you like without losing your menu. Configuration is saved independently in the dashboard."
  f3_title: "Per-item analytics"
  f3_desc: "Impressions · Clicks · CTR for each item. A feature almost no other menu builder offers."
  f4_title: "Deep site integration"
  f4_desc: "Call cart panel · search box · chat widget · JavaScript API. Not just static links."
  f5_title: "Multilingual & Shopify Markets"
  f5_desc: "Configure once, your menu automatically displays the right language and currency for each market."
  f6_title: "Conditional display"
  f6_desc: "By device · URL · customer status · language. All without code."
  f7_title: "Full autonomy"
  f7_desc: "Sale season? Update the banner in 2 minutes. New launch? Publish right now. No developer needed."
  f8_title: "Real support"
  f8_desc: "Live chat in the dashboard, responses in minutes. Navi+ Care is ready to design for you."
