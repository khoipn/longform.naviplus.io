  faq_label: "FAQ"
  faq_title: "Common questions"
  faq1_q: "Will Navi+ AI Menu Builder conflict with my existing theme?"
  faq1_a: "No. Navi+ AI Menu Builder is built with pure HTML5 and CSS3, without any external JavaScript libraries. This means zero conflicts with your theme or other apps — no matter which theme you're using."
  faq2_q: "Does it work on mobile and desktop?"
  faq2_a: "Yes. Navi+ AI Menu Builder is designed mobile-first, with separate configurations for mobile and desktop. You can show a Tab Bar on mobile and a Mega Menu on desktop — entirely independently."
  faq3_q: "I'm not on Shopify. Can I still use Navi+ AI Menu Builder?"
  faq3_a: "Yes. Navi+ AI Menu Builder works on any website via a simple embed code. Create a free account at dash.naviplus.app, add the snippet to your WordPress, Wix, Webflow, or any site, and you're ready to go."
  faq4_q: "Will it slow down my store?"
  faq4_a: "No. Navi+ AI Menu Builder uses a global CDN with edge servers across 6 continents and trusted by 5,000+ merchants with no latency. It's designed to be extremely lightweight and continuously optimized for performance."
  faq5_q: "What's included in the free plan?"
  faq5_a: "The free plan includes lifetime usage, 1 menu, 50,000 views/month, all core features, and email support — with no ads. Paid plans start at $6.25/month for more menus, higher view limits, and 24/7 support."
  faq6_q: "Do I need to know how to code?"
  faq6_a: "Not at all. Navi+ AI Menu Builder is fully drag-and-drop. Pick a template, customize colors and icons, and publish — no design or technical skills required. Advanced users can add custom CSS, HTML, or JavaScript if they want to go further."
