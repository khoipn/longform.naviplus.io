        - text: "Never advertisements"
        - text: "Hands-on support: migrate old menus, configure menus, and edit UI directly"
  enterprise:
    title: "Need a custom plan for an agency or enterprise?"
    body: "Contact us for volume pricing, white-label options, and dedicated support."
  faq:
    title: "Pricing FAQ"
    subtitle: "Everything you need to know before choosing a plan."
    items:
      - q: "I still want to try Premium features. What should I do?"
        a: "Most advanced features are visible in the editor so you can understand how your menu could be structured. For example, image upload may still appear on Starter, but premium-only parts are grayed out or limited. To test the full experience safely, upgrade to a paid plan and use the 7-day free trial — you will not pay anything during the trial period."
      - q: "Which plan should I start with?"
        a: "Start with Starter if you only need one Navi+ AI Menu Builder menu and want to validate the experience. Choose Business when you need more menus, image upload, multi-language support, analytics, and advanced interactions. Choose Elite when navigation becomes a core part of your storefront and you want unlimited usage, SEO support, premium CDN, and hands-on help."
      - q: "What happens when Starter or Business reaches the view limit?"
        a: "Starter includes up to 50,000 Navi+ AI Menu Builder views, and Business includes up to 500,000 Navi+ AI Menu Builder views per month. When your store reaches the limit, you will receive an email warning first. If it happens repeatedly, we may place a small ad in the corner of the menu without affecting the visitor experience. Important: we never hide your menu, because that would affect your customers."
      - q: "How can I test Business or Elite without risk?"
        a: "Use the 7-day free trial to publish real menus, test premium interactions, upload images, and check analytics before paying. If Navi+ AI Menu Builder is not the right fit, cancel before the trial ends and you will not be charged."
      - q: "Will I lose my menus if I downgrade later?"
        a: "No. Your configurations are saved. If the lower plan cannot keep every active feature — for example extra menus, image upload, multi-language, advanced interactions, or Elite-only SEO — you will choose what stays active instead of losing your work."
      - q: "When is Elite better than Business?"
        a: "Choose Elite when you want to remove the ceilings: unlimited menus, unlimited views, advanced image tools, SEO Search optimization, stronger global CDN failover, never advertisements, and hands-on help from the Navi+ AI Menu Builder team. It is the better fit when navigation is a central part of your store, not just a small add-on."
      - q: "Can Navi+ AI Menu Builder replace other paid apps?"
        a: "Often, yes. Navi+ AI Menu Builder can replace parts of premium navigation themes, menu builders, floating contact buttons, cart/search icon tools, and chat bubble replacements. At $6.25/month for Business, the cost is usually lower than stacking several small apps together."
      - q: "Does Navi+ AI Menu Builder work outside Shopify?"
        a: "Yes. Create a free account at dash.naviplus.app, grab your embed snippet, and paste it into WordPress, Wix, Webflow, or any website. You keep the same plan structure and the same Navi+ AI Menu Builder editor."
  cta:
    title: "Start free. Upgrade when your navigation grows."
    subtitle: "Use one menu for free, then scale into more menus, more views, richer media, analytics, and deeper support when your store needs it."
    shopify: "Install on Shopify — free"
