  how_title: "De l'installation au déploiement en quelques minutes"
  how_sub: "Pas de designers, pas de développeurs, pas de modifications de thème. Navi+ AI Menu Builder s'intègre dans votre boutique existante sans toucher une seule ligne de code."
  step1_title: "Installer Navi+ AI Menu Builder"
  step1_body: "Ajoutez l'application depuis le Shopify App Store — ou collez un simple snippet d'intégration sur WordPress, Wix, ou n'importe quelle plateforme. Plan gratuit disponible, aucune carte de crédit requise."
  step2_title: "Choisissez un modèle"
  step2_body: "Choisissez parmi 20+ mises en page de navigation pré-conçues. Tab bar pour mobile, mega menu pour desktop, slide menu pour tout écran. Chaque modèle est entièrement personnalisable."
  step3_title: "Publiez et guidez les visiteurs"
  step3_body: "Glissez, déposez et configurez. Votre nouveau menu s'active instantanément — ultra-rapide via CDN edge dans 6 continents, gérant des millions de requêtes sans ralentir votre boutique."
  navtypes_label: "Types de navigation"
  navtypes_title: "Conçu pour tous les écrans"
  navtypes_sub: "Chaque type de navigation sert un objectif différent — configurez-les indépendamment pour mobile et desktop depuis un seul tableau de bord."
  mega_menu_desc: "Affiche un menu déroulant riche avec des colonnes, des images et des liens en vedette. Parfait pour les boutiques avec de grands catalogues — guidez les clients directement vers la bonne catégorie sans les surcharger."
  tab_bar_desc: "Une barre de navigation fixe en bas pour mobile — tout comme les applications natives. Place vos pages les plus importantes à un coup de pouce, stimulant l'engagement et réduisant le taux de rebond."
  slide_menu_desc: "Un panneau coulissant fluide qui révèle votre navigation complète sans quitter la page. Idéal pour les boutiques mobiles-first qui veulent une expérience de navigation propre et sans distractions."
  sticky_navbar_desc: "Une barre de navigation supérieure qui reste visible alors que les visiteurs font défiler. Garde votre marque, votre barre de recherche et votre panier toujours accessibles — réduisant la friction et augmentant les conversions."
  learn_more: "En savoir plus"
  reviews_label: "Ce que disent les marchands"
  reviews_title: "De confiance pour les boutiques du monde entier"
  reviews_rating_sub: "77 avis sur le Shopify App Store"
  reviews_rating_pct: "99% des avis sont 5 étoiles"
