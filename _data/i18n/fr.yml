  review1_origin: "Émirats Arabes Unis"
  review2_origin: "États-Unis"
  review3_origin: "Pakistan"
  verified: "✓ Vérifié"
  faq_label: "FAQ"
  faq_title: "Questions courantes"
  faq1_q: "Navi+ AI Menu Builder entrera-t-il en conflit avec mon thème existant?"
  faq1_a: "Non. Navi+ AI Menu Builder est construit avec du HTML5 et du CSS3 purs, sans aucune bibliothèque JavaScript externe. Cela signifie zéro conflit avec votre thème ou d'autres applications — peu importe quel thème vous utilisez."
  faq2_q: "Fonctionne-t-il sur mobile et desktop?"
  faq2_a: "Oui. Navi+ AI Menu Builder est conçu mobile-first, avec des configurations distinctes pour mobile et desktop. Vous pouvez afficher une Tab Bar sur mobile et un Mega Menu sur desktop — entièrement indépendamment."
  faq3_q: "Je ne suis pas sur Shopify. Puis-je quand même utiliser Navi+ AI Menu Builder?"
  faq3_a: "Oui. Navi+ AI Menu Builder fonctionne sur n'importe quel site web via un simple code d'intégration. Créez un compte gratuit sur dash.naviplus.app, ajoutez le snippet à votre WordPress, Wix, Webflow, ou n'importe quel site, et vous êtes prêt."
  faq4_q: "Ralentira-t-il ma boutique?"
  faq4_a: "Non. Navi+ AI Menu Builder utilise un CDN global avec des serveurs edge sur 6 continents et auquel font confiance 5,000+ marchands sans latence. Il est conçu pour être extrêmement léger et continuellement optimisé pour la performance."
  faq5_q: "Qu'est-ce qui est inclus dans le plan gratuit?"
  faq5_a: "Le plan gratuit inclut l'utilisation à vie, 1 menu, 50,000 vues/mois, toutes les fonctionnalités principales et le support par email — sans publicités. Les plans payants commencent à $6.25/mois pour plus de menus, des limites de vue plus élevées et le support 24/7."
  faq6_q: "Dois-je savoir coder?"
  faq6_a: "Pas du tout. Navi+ AI Menu Builder est entièrement glisser-déposer. Choisissez un modèle, personnalisez les couleurs et les icônes, et publiez — aucune compétence en design ou technique requise. Les utilisateurs avancés peuvent ajouter du CSS, du HTML ou du JavaScript personnalisé s'ils veulent aller plus loin."
  platform_label: "Commencer"
  platform_title: "Choisissez votre\nplateforme."
  platform_sub: "Mêmes fonctionnalités, même tarification. Choisissez le chemin qui convient à votre boutique."
