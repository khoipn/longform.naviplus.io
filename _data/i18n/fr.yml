  enterprise:
    title: "Besoin d’un forfait agency ou enterprise ?"
    body: "Contactez-nous pour volume pricing, options white-label et support dédié."
  faq:
    title: "FAQ tarifs"
    subtitle: "Tout ce qu’il faut savoir avant de choisir un forfait."
    items:
      - q: "Je veux quand même essayer les fonctionnalités Premium. Que faire ?"
        a: "La plupart des fonctions avancées restent visibles dans l’éditeur pour vous aider à comprendre la structure possible de votre menu. Par exemple, l’upload d’images peut apparaître sur Starter, mais les parties réservées au Premium sont grisées ou limitées. Pour tester l’expérience complète sans risque, passez à un forfait payant et utilisez l’essai gratuit de 7 jours — aucun paiement pendant la période d’essai."
      - q: "Par quel forfait commencer ?"
        a: "Commencez avec Starter si vous avez seulement besoin d’un menu Navi+ AI Menu Builder et voulez valider l’expérience. Choisissez Business pour plus de menus, l’upload d’images, le multilingue, les analytics et les interactions avancées. Choisissez Elite quand la navigation devient centrale pour votre boutique et que vous voulez l’usage illimité, le support SEO, un CDN premium et une aide hands-on."
      - q: "Que se passe-t-il quand Starter ou Business atteint la limite de vues ?"
        a: "Starter inclut jusqu’à 50,000 vues Navi+ AI Menu Builder, et Business jusqu’à 500,000 vues Navi+ AI Menu Builder par mois. Quand votre boutique atteint la limite, vous recevez d’abord un email d’avertissement. Si cela se répète, nous pouvons placer une petite publicité dans le coin du menu sans affecter l’expérience visiteur. Important : nous ne masquons jamais votre menu, car cela affecterait vos clients."
      - q: "Comment tester Business ou Elite sans risque ?"
        a: "Utilisez l’essai gratuit de 7 jours pour publier de vrais menus, tester les interactions premium, uploader des images et consulter les analytics avant de payer. Si Navi+ AI Menu Builder ne convient pas, annulez avant la fin de l’essai et vous ne serez pas facturé."
      - q: "Vais-je perdre mes menus si je rétrograde plus tard ?"
        a: "Non. Vos configurations sont conservées. Si le forfait inférieur ne peut pas garder toutes les fonctions actives — menus supplémentaires, upload d’images, multilingue, interactions avancées ou SEO réservé à Elite — vous choisissez ce qui reste actif au lieu de perdre votre travail."
      - q: "Quand Elite est-il préférable à Business ?"
        a: "Choisissez Elite si vous voulez supprimer les plafonds : menus illimités, vues illimitées, outils image avancés, SEO Search optimization, failover CDN mondial renforcé, aucune publicité et aide hands-on de l’équipe Navi+ AI Menu Builder. C’est le bon choix quand la navigation est centrale pour votre boutique."
      - q: "Navi+ AI Menu Builder peut-il remplacer d’autres apps payantes ?"
        a: "Souvent, oui. Navi+ AI Menu Builder peut remplacer une partie des thèmes de navigation premium, menu builders, boutons de contact flottants, outils d’icônes cart/search et remplacements de chat bubble. À $6.25/mois pour Business, le coût est généralement plus bas que plusieurs petites apps combinées."
      - q: "Navi+ AI Menu Builder fonctionne-t-il hors Shopify ?"
        a: "Oui. Créez un compte gratuit sur dash.naviplus.app, récupérez votre embed snippet et collez-le dans WordPress, Wix, Webflow ou tout autre site. Vous gardez la même structure de forfaits et le même éditeur Navi+ AI Menu Builder."
  cta:
    title: "Commencez gratuitement. Passez à l’échelle avec votre navigation."
    subtitle: "Utilisez un menu gratuitement, puis ajoutez plus de menus, de vues, de médias, d’analytics et de support quand votre boutique en a besoin."
