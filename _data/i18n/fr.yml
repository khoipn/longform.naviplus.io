  slide_menu_pts: ["Navigation à plusieurs niveaux", "En-tête avec logo, recherche & compte", "Icônes, images & badges"]
  fab_menu_pts: ["Tous les contacts en un tap", "Shopify Inbox intégré", "Positionnez n'importe où"]
