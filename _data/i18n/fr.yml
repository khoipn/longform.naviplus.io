  faq_label: "Questions fréquentes"
  faq_title: "Avant de commencer"
  faq1_q: "Navi+ va-t-il ralentir mon site ?"
  faq1_a: "Non. Navi+ fonctionne sur un CDN mondial avec des serveurs sur 6 continents, utilisé par plus de 5 000 marchands. Il ajoute généralement moins de 10 ms au chargement et est continuellement optimisé."
  faq2_q: "Navi+ est-il fiable ? Y a-t-il une garantie de disponibilité ?"
  faq2_a: "Tous les plans fonctionnent sur une infrastructure de haute qualité avec un SLA de 99,00 %. Le plan Elite passe à Cloudflare + BunnyCDN pour un SLA de 99,99 %. Navi+ a traité des millions de requêtes sans interruption."
  faq3_q: "Combien de temps pour être en ligne ?"
  faq3_a: "La plupart des boutiques sont en ligne en moins de 5 minutes. Installez depuis le Shopify App Store (ou collez un extrait de code), choisissez un modèle et publiez — sans code, sans modifier votre thème."
  faq4_q: "Ai-je besoin de savoir coder ?"
  faq4_a: "Pas du tout. Navi+ est entièrement glisser-déposer. Choisissez un modèle, personnalisez les couleurs et les icônes, et publiez. Les utilisateurs avancés peuvent ajouter du CSS ou HTML personnalisé."
  faq5_q: "Y a-t-il un plan gratuit ?"
  faq5_a: "Oui. Le plan Starter est gratuit à vie — 1 menu, 50 000 vues/mois, toutes les fonctionnalités de base, sans carte de crédit. Passez à la version supérieure seulement si vous en avez besoin."
  coming_soon_name: "Bientôt disponible"
  coming_soon_desc: "Nous développons continuellement de nouveaux types de menus pour améliorer la navigation de votre site."
  platform_other_name: "Tout site web"
  platform_other_desc: "Compatible avec Wix, Squarespace, Webflow ou tout autre site. Ajoutez un seul extrait de code et votre menu Navi+ est en ligne — sans restriction de plateforme."
  platform_other_cta: "Créer un compte gratuit →"
  speed_label: "Performance"
  speed_title: "Ultra-léger.\nUltra-rapide."
  speed_1_title: "Brancher. Débrancher. Sans trace."
  speed_1_body: "Un extrait de code pour installer, un clic pour supprimer. Aucune modification de thème, aucun code résiduel, aucun verrouillage."
  speed_2_title: "Distribué depuis l'edge, pas depuis nos serveurs."
  speed_2_body: "Votre menu se charge depuis les nœuds Cloudflare et BunnyCDN dans le monde entier. Aucun backend dans le chemin critique — il reste rapide même si nos serveurs tombent."
  speed_3_title: "Accéléré par l'IA, par défaut."
  speed_3_body: "Générez des menus, rédigez des descriptions et optimisez la navigation avec l'IA. Chaque workflow est accéléré par l'IA pour aller plus vite."


why_navi_page:
  seo_title: "Pourquoi Navi+? — 7 critères pour un menu de navigation professionnel | Navi+"
  seo_desc: "Le thème par défaut vous donne une barre de texte plate. Navi+ résout les 7 critères qu'un menu de navigation professionnel doit remplir."
  hero_tag: "Design & Interface"
  problem_intro: "Avec de la chance, les visiteurs trouvent ce dont ils ont besoin dans les premières secondes de leur arrivée sur votre site. Mais quand cela n'arrive pas — et c'est la réalité pour la plupart des visites — le premier endroit où ils cherchent, le premier élément sur lequel ils cliquent, c'est le menu de navigation."
  p1_title: "Votre menu est trop simple"
  p1_desc: "Votre thème vous donne une barre de texte plate. Pas d'images, pas de regroupement, pas de guidage. Les visiteurs regardent, ne comprennent pas ce que vous vendez — et repartent."
  p2_title: "Vous voulez changer, mais ne savez pas par où commencer"
  p2_desc: "Vous savez que le menu doit être amélioré. Mais le thème est complexe, les apps risquent des conflits, les développeurs coûtent cher. Il n'y a pas de chemin clair à suivre."
  p3_title: "Difficile à contrôler et à maintenir dans le temps"
  p3_desc: "Changer de thème signifie tout perdre. Mettre à jour c'est prendre un risque. Même changer une bannière saisonnière nécessite un développeur. Votre menu — ce que vous devriez maîtriser — est ce sur quoi vous avez le moins de contrôle."
  criteria_label: "Standards professionnels"
  criteria_title: "Voici les 7 exigences d'un menu de navigation professionnel"
  criteria_lead: "Le menu est le deuxième élément le plus utilisé sur tout site (après « Ajouter au panier »). Voici ce que vous devriez exiger :"
  c1_title: "Polyvalent — et narratif"
  c1_desc: "Doit inclure tous les styles : Mega Menu pour desktop, Tab Bar pour mobile, Slide Menu pour un hamburger élégant, FAB pour les actions urgentes, Grid Menu pour les landing pages. Plus important : le menu doit guider le parcours d'achat, pas seulement lister des catégories."
  c2_title: "Compatible — sans conflits"
  c2_desc: "Doit coexister avec le reste de votre site. Sans masquer le panier, sans casser le panneau de recherche, sans superposer le widget de chat. Même en changeant de thème, rien n'est perdu — le menu vit indépendamment du thème."
  c3_title: "Rapide et extrêmement fiable"
  c3_desc: "Le menu ne doit jamais « tomber ». Il doit se charger vite, fonctionner même avec une connexion lente, et ne jamais bloquer le rendu de la page principale. C'est le composant qui doit toujours être prêt — sur n'importe quel appareil, à tout moment."
  c4_title: "Mesurable — jusqu'à chaque item"
  c4_desc: "Doit mesurer combien de fois chaque item est affiché (impressions) et combien de fois il est cliqué. Google Analytics ne peut pas faire ça. Sans ces données, tout changement de menu n'est que conjecture."
  c5_title: "Intégration avec les autres apps du site"
  c5_desc: "Doit pouvoir ouvrir la barre de recherche, le panneau panier, le widget chat. Doit prendre en charge les appels JavaScript pour s'intégrer à n'importe quelle app. Un menu moderne est un point de contrôle central — pas une table des matières statique."
  c6_title: "Multilingue et multi-marchés"
  c6_desc: "Doit s'intégrer avec Shopify Markets, le multilingue WordPress, afficher la bonne devise et les bons labels pour chaque marché. C'est un standard, pas une fonctionnalité premium."
  c7_title: "Autonome — sans développeur"
  c7_desc: "Vous — le propriétaire du site — devez pouvoir modifier le menu quand vous le souhaitez. Saison des soldes, lancement d'une nouvelle collection, changement de stratégie, test A/B — tout doit être faisable par glisser-déposer, sans développeur, sans déploiement."
  solution_label: "Solution"
  solution_title: "Navi+ AI Menu Builder — résout les 7 critères"
  solution_lead: "Navi+ est un <strong>constructeur de menus sans code</strong> — pour créer de beaux menus à fort taux de conversion sur n'importe quel site, sans toucher à votre thème ni écrire une ligne de code."
  how_heading: "Comment Navi+ fonctionne"
  how_desc: "Navi+ est un <strong style=\"color:#0f1117;\">widget</strong> — il ne remplace pas et ne modifie pas votre thème existant. Tout est géré depuis le tableau de bord. Les modifications sont publiées instantanément."
  s1_title: "Créez votre menu dans le tableau de bord"
  s1_desc: "Glisser-déposer, pas de code. Vous avez le contrôle total."
  s2_title: "Intégrez une seule fois"
  s2_desc: "App Block sur Shopify ou un snippet sur les autres plateformes."
  s3_title: "Le menu s'affiche sur votre site — indépendant du thème"
  s3_desc: "Changez de thème autant que vous voulez, votre menu reste intact. Publication instantanée."
  speed_badge: "Distribué via Cloudflare CDN · <span>~52 ms</span> de temps de chargement moyen"
  platforms_label: "Compatible avec toutes les plateformes"
  platform_any: "N'importe quel site"
  not_label: "Navi+ N'EST PAS"
  not1: "<strong style=\"color:#0f1117;\">Pas un thème</strong> — fonctionne en parallèle avec votre thème actuel, ne le remplace pas."
  not2: "<strong style=\"color:#0f1117;\">Pas d'installation manuelle</strong> — un App Block (Shopify), un plugin (WordPress) ou un snippet suffit."
  not3: "<strong style=\"color:#0f1117;\">Ne peut pas casser votre site</strong> — si Navi+ est désactivé, le menu original de votre thème revient automatiquement."
  feats_label: "Fonctionnalités clés"
  f1_title: "5 types de menus en une seule app"
  f1_desc: "Mega Menu · Tab Bar · Slide Menu · FAB · Grid Menu. Combinez selon vos besoins, concevez par glisser-déposer."
  f2_title: "Indépendant du thème"
  f2_desc: "Changez de thème autant que vous voulez sans perdre votre menu. La configuration est sauvegardée indépendamment dans le tableau de bord."
  f3_title: "Analytics par item"
  f3_desc: "Impressions · Clics · CTR pour chaque item. Une fonctionnalité rare dans les autres constructeurs de menus."
  f4_title: "Intégration profonde avec le site"
  f4_desc: "Ouvrez le panier · la recherche · le chat · API JavaScript. Pas seulement des liens statiques."
  f5_title: "Multilingue & Shopify Markets"
  f5_desc: "Configurez une fois, le menu affiche automatiquement la bonne langue et devise pour chaque marché."
  f6_title: "Affichage conditionnel"
  f6_desc: "Par appareil · URL · statut client · langue. Tout sans code."
  f7_title: "Autonomie totale"
  f7_desc: "Saison des soldes ? Changez la bannière en 2 minutes. Lancement de produit ? Publiez maintenant. Sans développeur."
  f8_title: "Support réel"
  f8_desc: "Chat en direct dans le tableau de bord, réponse en quelques minutes. Navi+ Care est prêt à concevoir pour vous."
