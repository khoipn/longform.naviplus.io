  faq_label: "常见问题"
  faq_title: "常见问题"
  faq1_q: "Navi+ AI Menu Builder 会与我现有的主题冲突吗?"
  faq1_a: "不会。Navi+ AI Menu Builder 使用纯 HTML5 和 CSS3 构建,没有任何外部 JavaScript 库。这意味着与您的主题或其他应用没有冲突 —— 无论您使用哪个主题。"
  faq2_q: "它在移动设备和桌面上都能工作吗?"
  faq2_a: "可以。Navi+ AI Menu Builder 采用移动优先设计,为移动设备和桌面提供单独的配置。您可以在移动设备上显示 Tab Bar,在桌面上显示 Mega Menu —— 完全独立。"
  faq3_q: "我不在 Shopify 上。我还能使用 Navi+ AI Menu Builder 吗?"
  faq3_a: "可以。Navi+ AI Menu Builder 通过简单的嵌入代码在任何网站上工作。在 dash.naviplus.app 创建免费账户,将代码片段添加到您的 WordPress、Wix、Webflow 或任何网站,就可以开始了。"
  faq4_q: "它会减慢我的商店吗?"
  faq4_a: "不会。Navi+ AI Menu Builder 使用全球 CDN,在 6 个大洲拥有边缘服务器,并被 5,000+ 商家信赖,没有延迟。它被设计得极其轻量,并不断针对性能进行优化。"
  faq5_q: "免费套餐包含什么?"
  faq5_a: "免费套餐包括终身使用、1 个菜单、50,000 次浏览/月、所有核心功能和电子邮件支持 —— 没有广告。付费计划从 $6.25/月起,包括更多菜单、更高的浏览限制和 24/7 支持。"
  faq6_q: "我需要知道如何编码吗?"
  faq6_a: "一点都不需要。Navi+ AI Menu Builder 完全是拖放式的。选择一个模板,自定义颜色和图标,然后发布 —— 无需设计或技术技能。高级用户可以添加自定义 CSS、HTML 或 JavaScript,如果他们想进一步扩展功能的话。"
