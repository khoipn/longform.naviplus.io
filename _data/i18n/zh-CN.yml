  enterprise:
    title: "需要 agency 或 enterprise 自定义套餐？"
    body: "联系我们获取批量价格、白标选项和专属支持。"
  faq:
    title: "价格 FAQ"
    subtitle: "选择套餐前需要了解的内容。"
    items:
      - q: "我仍想试用 Premium 功能，该怎么做？"
        a: "大多数高级功能会在编辑器中显示，方便你理解菜单结构。例如，Starter 中可能也会看到图片上传入口，但 Premium 专属部分会变灰或受限。若要安全试用完整体验，请升级到付费套餐并使用 7 天免费试用 — 试用期间不会收费。"
      - q: "我应该从哪个套餐开始？"
        a: "如果只需要 1 个 Navi+ AI Menu Builder 菜单并想先验证体验，请从 Starter 开始。需要更多菜单、图片上传、多语言、analytics 和高级交互时选择 Business。当导航成为店铺核心，并需要无限使用、SEO 支持、Premium CDN 和人工协助时选择 Elite。"
      - q: "Starter 或 Business 达到 view 限制会怎样？"
        a: "Starter 包含最多 50,000 Navi+ AI Menu Builder views，Business 包含每月最多 500,000 Navi+ AI Menu Builder views。达到限制时，你会先收到邮件提醒。如果多次发生，我们可能会在菜单角落放置一个小广告，但不会影响访客体验。重要：我们永远不会隐藏你的菜单，因为这会影响你的客户。"
      - q: "如何无风险试用 Business 或 Elite？"
        a: "使用 7 天免费试用，在付款前发布真实菜单、测试 Premium 交互、上传图片并查看 analytics。如果 Navi+ AI Menu Builder 不适合，只需在试用结束前取消，就不会被收费。"
      - q: "以后降级会丢失菜单吗？"
        a: "不会。你的配置会被保存。如果低套餐无法保留所有已启用功能，你可以选择哪些继续启用，而不是丢失工作。"
      - q: "什么时候 Elite 比 Business 更合适？"
        a: "当你想移除限制时选择 Elite：无限菜单、无限 views、高级图片工具、SEO Search optimization、更强的全球 CDN 故障切换、永不显示广告，以及 Navi+ AI Menu Builder 团队人工协助。"
      - q: "Navi+ AI Menu Builder 能替代其他付费 app 吗？"
        a: "很多情况下可以。Navi+ AI Menu Builder 可以替代部分高级导航主题、菜单构建器、悬浮联系按钮、购物车/搜索图标工具和聊天气泡替换工具。"
      - q: "Navi+ AI Menu Builder 可以在 Shopify 之外使用吗？"
        a: "可以。在 dash.naviplus.app 创建免费账号，复制 embed snippet，并粘贴到 WordPress、Wix、Webflow 或任意网站。"
