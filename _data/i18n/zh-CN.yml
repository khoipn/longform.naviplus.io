why_navi_page:
  seo_title: "为什么选择 Navi+？— 专业导航菜单的7项标准 | Navi+"
  seo_desc: "默认主题给你一条扁平文字栏。Navi+ 满足专业导航菜单必须达到的全部7项标准。"
  hero_tag: "设计与界面"
  problem_intro: "幸运的话，访客会在登陆您网站的最初几秒内找到所需内容。但当这种情况没有发生时——而大多数访问确实如此——他们首先寻找、首先点击的，就是导航菜单。"
  p1_title: "菜单太简单"
  p1_desc: "您的主题给您一条扁平的文字栏。没有图片、没有分组、没有引导。访客看了不知道您卖什么——然后离开。"
  p2_title: "想改变，却不知从哪里开始"
  p2_desc: "您知道菜单需要改进。但主题复杂、应用有冲突风险、开发者费用高昂。没有清晰的前进路径。"
  p3_title: "难以控制和长期维护"
  p3_desc: "换主题就失去一切。升级就要承担风险。即使是季节性横幅更换也需要开发者。您的菜单——本应是您最能掌控的——却是您控制最少的。"
  criteria_label: "专业标准"
  criteria_title: "这是您应该对专业菜单提出的7项要求"
  criteria_lead: "菜单是网站上用户互动第二多的元素（仅次于「加入购物车」按钮）。以下是您应该期待的："
  c1_title: "功能全面——并能讲述故事"
  c1_desc: "必须包含所有展示风格：桌面版大型菜单、移动端标签栏、汉堡菜单滑动面板、悬浮操作按钮、网格菜单。更重要的是：菜单必须引导购物旅程，而不仅仅是列出分类。"
  c2_title: "兼容——无冲突"
  c2_desc: "必须与网站其他部分和平共存。不遮挡购物车、不破坏搜索面板、不覆盖聊天小部件。更换主题时也不会丢失配置——因为菜单必须独立于主题存在。"
  c3_title: "快速且极其可靠"
  c3_desc: "菜单绝不能\"宕机\"。必须加载足够快、在慢速连接下正常工作，并且绝不阻塞主页面渲染。它是必须始终准备好的组件——任何设备、任何时候。"
  c4_title: "可衡量——精确到每个菜单项"
  c4_desc: "必须追踪每个菜单项的显示次数（曝光量）和点击次数。谷歌分析做不到这一点。没有这些数据，每次菜单更改都只是猜测。"
  c5_title: "与网站其他应用集成"
  c5_desc: "必须能够打开搜索框、购物车面板和聊天小部件。必须支持JavaScript调用以与任何应用集成。现代菜单是中央控制点——不是静态目录。"
  c6_title: "多语言和多市场"
  c6_desc: "必须与Shopify Markets集成、支持WordPress多语言，并为每个市场显示正确的货币和标签。这是标准，不是高级功能。"
  c7_title: "独立——无需开发者"
  c7_desc: "您——网站所有者——必须能在需要时随时更改菜单。促销季、新系列发布、营销策略调整、A/B测试——所有操作都必须通过拖放完成，无需开发者，无需部署。"
  solution_label: "解决方案"
  solution_title: "Navi+ 菜单构建器——解决全部7项标准"
  solution_lead: "Navi+ 是一款<strong>无代码菜单构建器</strong>——帮助您为任何网站创建精美的高转化率菜单，无需触碰主题，无需编写任何代码。"
  how_heading: "Navi+ 如何工作"
  how_desc: "Navi+ 是一个<strong style=\"color:#0f1117;\">小部件</strong>——不替换或修改您现有的主题。所有操作从仪表板管理。更改即时生效。"
  s1_title: "在仪表板中构建菜单"
  s1_desc: "拖放操作，无需代码。您完全掌控。"
  s2_title: "一次嵌入"
  s2_desc: "Shopify上的App Block或其他平台上的代码片段。"
  s3_title: "菜单在网站上渲染——独立于主题"
  s3_desc: "随意更换主题，您的菜单保持不变。即时发布。"
  speed_badge: "通过Cloudflare CDN分发 · <span>~52ms</span> 平均加载时间"
  platforms_label: "适用于所有平台"
  platform_any: "任何网站"
  not_label: "Navi+ 不是"
  not1: "<strong style=\"color:#0f1117;\">不是主题</strong>——与您现有的主题并行运行，不替换它。"
  not2: "<strong style=\"color:#0f1117;\">无需手动安装</strong>——一个App Block（Shopify）、插件（WordPress）或代码片段即可。"
  not3: "<strong style=\"color:#0f1117;\">不会损坏您的网站</strong>——如果Navi+被禁用，您主题的原始菜单会自动恢复。"
  feats_label: "核心功能"
  f1_title: "一个应用，5种菜单类型"
  f1_desc: "大型菜单·标签栏·滑动菜单·悬浮按钮·网格菜单。按需组合，通过拖放设计。"
  f2_title: "独立于主题"
  f2_desc: "随意更换主题而不丢失菜单。配置独立保存在仪表板中。"
  f3_title: "逐项分析"
  f3_desc: "每个菜单项的曝光量·点击量·点击率。几乎没有其他菜单构建器提供此功能。"
  f4_title: "深度网站集成"
  f4_desc: "调用购物车面板·搜索框·聊天小部件·JavaScript API。不仅仅是静态链接。"
  f5_title: "多语言 & Shopify Markets"
  f5_desc: "配置一次，菜单自动为每个市场显示正确的语言和货币。"
  f6_title: "条件显示"
  f6_desc: "按设备·URL·客户状态·语言。全部无需代码。"
  f7_title: "完全自主"
  f7_desc: "促销季？2分钟更换横幅。新品发布？立即发布。无需开发者。"
  f8_title: "真实支持"
  f8_desc: "仪表板内实时聊天，几分钟内回复。Navi+ Care随时为您设计。"
