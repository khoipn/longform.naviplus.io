  faq1_q: "Navi+ 会让我的网站变慢吗？"
  faq1_a: "不会。Navi+ 在覆盖6大洲的全球 CDN 上运行，服务超过5,000家商家。通常对页面加载时间的影响不超过10毫秒，并持续进行性能优化。"
  faq2_q: "Navi+ 可靠吗？有运行时间保障吗？"
  faq2_a: "所有套餐均运行在高质量基础设施上，提供99.00% SLA保障。Elite套餐升级为Cloudflare + BunnyCDN故障转移，提供99.99% SLA。Navi+ 已无间断处理了数百万次导航请求。"
  faq3_q: "多快可以上线？"
