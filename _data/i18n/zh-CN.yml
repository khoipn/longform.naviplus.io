  faq4_q: "我需要会编程吗？"
  faq4_a: "完全不需要。Navi+ 是完全拖放式操作。选择模板，自定义颜色和图标，然后发布。高级用户也可以添加自定义CSS或HTML。"
  faq5_q: "有免费套餐吗？"
  faq5_a: "有。Starter套餐永久免费——1个菜单，每月50,000次展示，所有核心功能，无需信用卡。只在需要更多时才升级。"
