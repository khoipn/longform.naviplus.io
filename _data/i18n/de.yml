  faq_label: "FAQ"
  faq_title: "Häufig gestellte Fragen"
  faq1_q: "Wird Navi+ AI Menu Builder mit meinem bestehenden Theme in Konflikt geraten?"
  faq1_a: "Nein. Navi+ AI Menu Builder ist mit reinem HTML5 und CSS3 ohne externe JavaScript-Bibliotheken entwickelt. Das bedeutet null Konflikte mit Ihrem Theme oder anderen Apps — egal welches Theme Sie verwenden."
  faq2_q: "Funktioniert es auf mobile und Desktop?"
  faq2_a: "Ja. Navi+ AI Menu Builder ist mobile-first entwickelt mit separaten Konfigurationen für mobile und Desktop. Sie können eine Tab Bar auf mobile und ein Mega Menu auf Desktop anzeigen — vollständig unabhängig."
  faq3_q: "Ich bin nicht auf Shopify. Kann ich Navi+ AI Menu Builder trotzdem verwenden?"
  faq3_a: "Ja. Navi+ AI Menu Builder funktioniert auf jeder Website über einen einfachen Einbettungscode. Erstellen Sie ein kostenloses Konto auf dash.naviplus.app, fügen Sie den Code zu Ihrem WordPress, Wix, Webflow oder einer anderen Website hinzu, und schon geht's los."
  faq4_q: "Wird es meinen Shop verlangsamen?"
  faq4_a: "Nein. Navi+ AI Menu Builder nutzt ein globales CDN mit Edge-Servern auf 6 Kontinenten und wird von 5,000+ Händlern ohne Latenz vertraut. Es ist extrem leicht und wird kontinuierlich für Leistung optimiert."
  faq5_q: "Was ist im kostenlosen Plan enthalten?"
  faq5_a: "Der kostenlose Plan umfasst lebenslange Nutzung, 1 Menü, 50,000 Views/Monat, alle Kernfunktionen und E-Mail-Support — ohne Werbung. Bezahlte Pläne beginnen bei $6.25/Monat für mehr Menüs, höhere View-Limits und 24/7-Support."
  faq6_q: "Muss ich programmieren können?"
  faq6_a: "Überhaupt nicht. Navi+ AI Menu Builder ist vollständig Drag-and-Drop. Wählen Sie eine Vorlage, passen Sie Farben und Symbole an und veröffentlichen Sie — keine Design- oder technischen Fähigkeiten erforderlich. Fortgeschrittene Benutzer können benutzerdefiniertes CSS, HTML oder JavaScript hinzufügen, wenn sie noch weiter gehen möchten."
