  how_title: "Vom Installieren bis zur Veröffentlichung in Minuten"
  how_sub: "Keine Designer, keine Entwickler, keine Theme-Bearbeitungen. Navi+ AI Menu Builder passt sich Ihrem bestehenden Shop an, ohne eine einzige Codezeile anzufassen."
  step1_title: "Installieren Sie Navi+ AI Menu Builder"
  step1_body: "Fügen Sie die App aus dem Shopify App Store hinzu — oder fügen Sie einen einfachen Einbettungscode auf WordPress, Wix oder einer anderen Plattform ein. Kostenloser Plan verfügbar, keine Kreditkarte erforderlich."
  step2_title: "Wählen Sie eine Vorlage"
  step2_body: "Wählen Sie aus 20+ vorgefertigten Navigationslayouts. Tab Bar für mobile, Mega Menu für Desktop, Slide Menu für jeden Bildschirm. Jede Vorlage ist vollständig anpassbar."
  step3_title: "Veröffentlichen und leiten Sie Besucher"
  step3_body: "Ziehen, ablegen und konfigurieren. Ihr neues Menü wird sofort live — blitzschnell über CDN Edge auf 6 Kontinenten, Millionen von Anfragen bearbeitet, ohne Ihren Shop zu verlangsamen."
  navtypes_label: "Navigationstypen"
  navtypes_title: "Für jeden Bildschirm entwickelt"
  navtypes_sub: "Jeder Navigationstyp erfüllt einen anderen Zweck — konfigurieren Sie sie unabhängig für mobile und Desktop von einem Dashboard aus."
  mega_menu_desc: "Zeigt ein reichhaltiges Dropdown-Menü mit Spalten, Bildern und Featured Links. Perfekt für Shops mit großen Katalogen — leiten Sie Käufer direkt zur richtigen Kategorie, ohne sie zu überfordern."
  tab_bar_desc: "Eine feste untere Navigationsleiste für mobile — genau wie native Apps. Platziert Ihre wichtigsten Seiten nur einen Fingertipp entfernt und erhöht das Engagement und reduziert die Absprungrate."
  slide_menu_desc: "Ein sanft einschiebendes Panel, das Ihre vollständige Navigation offenbart, ohne die Seite zu verlassen. Ideal für mobile-first Shops, die eine saubere, ablenkungsfreie Browsing-Erfahrung mögen."
  sticky_navbar_desc: "Eine obere Navigationsleiste, die sichtbar bleibt, wenn Besucher scrollen. Hält Ihre Marke, Suche und Warenkorb immer erreichbar — reduziert Reibung und erhöht Konversionen."
