  enterprise:
    title: "Benötigen Sie einen individuellen Plan für Agentur oder Enterprise?"
    body: "Kontaktieren Sie uns für Volumenpreise, White-Label-Optionen und dedizierten Support."
  faq:
    title: "Pricing FAQ"
    subtitle: "Alles, was Sie vor der Planwahl wissen müssen."
    items:
      - q: "Ich möchte Premium-Funktionen ausprobieren. Was soll ich tun?"
        a: "Die meisten erweiterten Funktionen sind im Editor sichtbar, damit Sie die mögliche Menüstruktur verstehen. Zum Beispiel kann Bild-Upload im Starter sichtbar sein, Premium-Bereiche sind jedoch ausgegraut oder begrenzt. Für den vollständigen Test upgraden Sie auf einen bezahlten Plan und nutzen die 7-tägige kostenlose Testphase — währenddessen zahlen Sie nichts."
      - q: "Mit welchem Plan sollte ich starten?"
        a: "Starten Sie mit Starter, wenn Sie nur ein Navi+ AI Menu Builder Menü benötigen. Wählen Sie Business für mehr Menüs, Bild-Upload, Mehrsprachigkeit, Analytics und erweiterte Interaktionen. Wählen Sie Elite, wenn Navigation zentral für Ihren Store ist und Sie unbegrenzte Nutzung, SEO-Support, Premium-CDN und Hands-on-Hilfe möchten."
      - q: "Was passiert, wenn Starter oder Business das View-Limit erreicht?"
        a: "Starter enthält bis zu 50,000 Navi+ AI Menu Builder Views, Business bis zu 500,000 Navi+ AI Menu Builder Views pro Monat. Wenn Ihr Store das Limit erreicht, erhalten Sie zuerst eine E-Mail-Warnung. Wenn es wiederholt passiert, können wir eine kleine Anzeige in der Menüecke platzieren, ohne die Besucher-Erfahrung zu beeinträchtigen. Wichtig: Wir verstecken Ihr Menü niemals, weil das Ihre Kunden beeinträchtigen würde."
      - q: "Wie kann ich Business oder Elite ohne Risiko testen?"
        a: "Nutzen Sie die 7-tägige kostenlose Testphase, um echte Menüs zu veröffentlichen, Premium-Interaktionen zu testen, Bilder hochzuladen und Analytics zu prüfen. Wenn Navi+ AI Menu Builder nicht passt, kündigen Sie vor Ende der Testphase und es wird nichts berechnet."
      - q: "Verliere ich meine Menüs bei einem späteren Downgrade?"
        a: "Nein. Ihre Konfigurationen bleiben gespeichert. Wenn der niedrigere Plan nicht alle aktiven Funktionen behalten kann, wählen Sie aus, was aktiv bleibt, statt Ihre Arbeit zu verlieren."
      - q: "Wann ist Elite besser als Business?"
        a: "Wählen Sie Elite, wenn Sie Limits entfernen möchten: unbegrenzte Menüs, unbegrenzte Views, erweiterte Bildtools, SEO Search optimization, stärkeres globales CDN-Failover, keine Werbung und Hands-on-Hilfe vom Navi+ AI Menu Builder Team."
      - q: "Kann Navi+ AI Menu Builder andere bezahlte Apps ersetzen?"
        a: "Oft ja. Navi+ AI Menu Builder kann Teile von Premium-Navigation-Themes, Menu Buildern, Floating Contact Buttons, Cart/Search Icon Tools und Chat-Bubble-Replacements ersetzen."
      - q: "Funktioniert Navi+ AI Menu Builder außerhalb von Shopify?"
        a: "Ja. Erstellen Sie ein kostenloses Konto auf dash.naviplus.app, kopieren Sie das Embed Snippet und fügen Sie es in WordPress, Wix, Webflow oder jede Website ein."
