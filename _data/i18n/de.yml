  faq_label: "Häufige Fragen"
  faq_title: "Bevor du anfängst"
  faq1_q: "Verlangsamt Navi+ meine Website?"
  faq1_a: "Nein. Navi+ läuft auf einem globalen CDN mit Servern auf 6 Kontinenten, genutzt von über 5.000 Händlern. Es fügt typischerweise unter 10 ms zur Ladezeit hinzu und wird kontinuierlich optimiert."
  faq2_q: "Ist Navi+ zuverlässig? Gibt es eine Uptime-Garantie?"
  faq2_a: "Alle Pläne laufen auf hochwertiger Infrastruktur mit einem 99,00 % SLA. Elite-Pläne wechseln zu Cloudflare + BunnyCDN für 99,99 % SLA. Navi+ hat Millionen von Anfragen ohne Unterbrechung verarbeitet."
  faq3_q: "Wie schnell kann ich live gehen?"
  faq3_a: "Die meisten Shops gehen in unter 5 Minuten live. Installiere aus dem Shopify App Store (oder füge einen Einbettungscode ein), wähle eine Vorlage und veröffentliche — kein Code, keine Theme-Anpassungen."
  faq4_q: "Muss ich programmieren können?"
  faq4_a: "Überhaupt nicht. Navi+ ist vollständig per Drag-and-Drop. Wähle eine Vorlage, passe Farben und Icons an und veröffentliche. Fortgeschrittene Nutzer können auch benutzerdefiniertes CSS oder HTML hinzufügen."
  faq5_q: "Gibt es einen kostenlosen Plan?"
  faq5_a: "Ja. Der Starter-Plan ist dauerhaft kostenlos — 1 Menü, 50.000 Aufrufe/Monat, alle Kernfunktionen, keine Kreditkarte. Upgrade nur, wenn du mehr benötigst."
  coming_soon_name: "Demnächst"
  coming_soon_desc: "Wir entwickeln kontinuierlich neue Menütypen, um die Navigation Ihrer Website zu verbessern."
  platform_other_name: "Jede Website"
  platform_other_desc: "Funktioniert mit Wix, Squarespace, Webflow oder jeder anderen Website. Füge einen Einbettungscode hinzu und dein Navi+-Menü ist live — keine Plattformbeschränkungen."
  platform_other_cta: "Kostenloses Konto erstellen →"
  speed_label: "Performance"
  speed_title: "Federleicht.\nBlitzschnell."
  speed_1_title: "Einbauen. Rausnehmen. Spurlos."
  speed_1_body: "Ein Snippet zum Installieren, ein Klick zum Entfernen. Keine Theme-Anpassungen, kein übrig gebliebener Code, keine Abhängigkeit."
  speed_2_title: "Ausgeliefert vom Edge, nicht von uns."
  speed_2_body: "Dein Menü lädt von Cloudflare- und BunnyCDN-Knoten weltweit. Kein Backend im kritischen Pfad — bleibt schnell, selbst wenn unsere Server ausfallen."
  speed_3_title: "KI-beschleunigt, standardmäßig."
  speed_3_body: "Erstelle Menüs, schreibe Beschreibungen und optimiere Navigation mit KI. Jeder Workflow ist KI-beschleunigt, damit du schneller lieferst."


why_navi_page:
  seo_title: "Warum Navi+? — 7 Kriterien für ein professionelles Navigationsmenü | Navi+"
  seo_desc: "Das Standardtheme gibt Ihnen eine flache Textleiste. Navi+ erfüllt alle 7 Kriterien, die ein professionelles Navigationsmenü erfüllen muss."
  hero_tag: "Design & Interface"
  problem_intro: "Im besten Fall finden Besucher innerhalb der ersten Sekunden auf Ihrer Website, was sie suchen. Wenn das nicht passiert — und das ist bei den meisten Besuchen der Fall — ist das Erste, wo sie nachschauen, das Erste, worauf sie klicken, das Navigationsmenü."
  p1_title: "Ihr Menü ist zu einfach"
  p1_desc: "Ihr Theme gibt Ihnen eine flache Textleiste. Keine Bilder, keine Gruppierung, keine Führung. Besucher schauen drauf, verstehen nicht, was Sie verkaufen — und gehen."
  p2_title: "Ändern wollen, aber nicht wissen, wo anfangen"
  p2_desc: "Sie wissen, das Menü braucht Verbesserungen. Aber das Theme ist verwirrend, Apps riskieren Konflikte, Entwickler kosten Geld. Es gibt keinen klaren Weg vorwärts."
  p3_title: "Schwer zu kontrollieren und langfristig zu pflegen"
  p3_desc: "Theme wechseln bedeutet alles verlieren. Upgrade bedeutet Risiko. Selbst ein saisonales Banner-Update braucht einen Entwickler. Ihr Menü — das, was Sie besitzen sollten — ist das, was Sie am wenigsten kontrollieren."
  criteria_label: "Professionelle Standards"
  criteria_title: "Das sind die 7 Dinge, die Sie von einem professionellen Menü verlangen sollten"
  criteria_lead: "Das Menü ist das am zweithäufigsten genutzte Element auf jeder Website (nach \"In den Warenkorb\"). Hier ist, was Sie erwarten sollten:"
  c1_title: "Vielseitig — und erzählt eine Geschichte"
  c1_desc: "Muss jeden Stil beinhalten: Mega Menu für Desktop, Tab Bar für Mobile, Slide Menu für ein sauberes Hamburger-Menü, FAB für dringende Aktionen, Grid Menu für Landing Pages. Wichtiger: Das Menü muss die Kaufreise führen, nicht nur Kategorien auflisten."
  c2_title: "Kompatibel — keine Konflikte"
  c2_desc: "Muss friedlich mit dem Rest Ihrer Website koexistieren. Kein Verbergen des Warenkorbs, kein Kaputt machen des Suchpanels, kein Überlappen des Chat-Widgets. Beim Theme-Wechsel geht nichts verloren — das Menü lebt unabhängig vom Theme."
  c3_title: "Schnell und äußerst zuverlässig"
  c3_desc: "Das Menü darf nie \"sterben\". Es muss schnell laden, bei langsamen Verbindungen funktionieren und das Rendering der Hauptseite nie blockieren. Es ist die Komponente, die immer bereit sein muss — auf jedem Gerät, jederzeit."
  c4_title: "Messbar — bis zum einzelnen Item"
  c4_desc: "Muss messen, wie oft jedes Item angezeigt (Impressionen) und geklickt wurde. Google Analytics kann das nicht. Ohne diese Daten ist jede Menü-Änderung nur eine Vermutung."
  c5_title: "Integration mit anderen Apps auf Ihrer Website"
  c5_desc: "Muss in der Lage sein, die Suchleiste, das Warenkorb-Panel und das Chat-Widget zu öffnen. Muss JavaScript-Aufrufe unterstützen, um sich in jede App zu integrieren. Ein modernes Menü ist ein zentraler Kontrollpunkt — keine statische Inhaltsübersicht."
  c6_title: "Mehrsprachig und Multi-Market"
  c6_desc: "Muss sich in Shopify Markets integrieren, mehrsprachiges WordPress unterstützen und die richtige Währung und Beschriftungen für jeden Markt anzeigen. Das ist ein Standard, kein Premium-Feature."
  c7_title: "Unabhängig — kein Entwickler erforderlich"
  c7_desc: "Sie — der Website-Besitzer — müssen das Menü jederzeit ändern können. Sale-Saison, neuer Kollektion-Launch, Marketing-Strategie-Änderung, A/B-Test — alles muss per Drag-and-Drop möglich sein, kein Entwickler, kein Deployment."
  solution_label: "Lösung"
  solution_title: "Navi+ AI Menu Builder — löst alle 7 Kriterien"
  solution_lead: "Navi+ ist ein <strong>No-Code-Menü-Builder</strong> — um schöne, hochkonvertierende Menüs für jede Website zu erstellen, ohne Ihr Theme anzufassen oder eine einzige Codezeile zu schreiben."
  how_heading: "Wie Navi+ funktioniert"
  how_desc: "Navi+ ist ein <strong style=\"color:#0f1117;\">Widget</strong> — es ersetzt oder modifiziert Ihr bestehendes Theme nicht. Alles wird vom Dashboard aus verwaltet. Änderungen gehen sofort live."
  s1_title: "Menü im Dashboard erstellen"
  s1_desc: "Drag and Drop, kein Code nötig. Sie haben die volle Kontrolle."
  s2_title: "Einmal einbetten"
  s2_desc: "App Block auf Shopify oder ein Snippet auf anderen Plattformen."
  s3_title: "Menü wird auf Ihrer Website gerendert — theme-unabhängig"
  s3_desc: "Wechseln Sie das Theme so oft Sie möchten, Ihr Menü bleibt intakt. Sofortige Veröffentlichung."
  speed_badge: "Über Cloudflare CDN bereitgestellt · <span>~52 ms</span> durchschnittliche Ladezeit"
  platforms_label: "Funktioniert mit jeder Plattform"
  platform_any: "Jede Website"
  not_label: "Navi+ ist NICHT"
  not1: "<strong style=\"color:#0f1117;\">Kein Theme</strong> — funktioniert parallel zu Ihrem bestehenden Theme, ersetzt es nicht."
  not2: "<strong style=\"color:#0f1117;\">Keine manuelle Installation</strong> — ein App Block (Shopify), Plugin (WordPress) oder ein Snippet reicht aus."
  not3: "<strong style=\"color:#0f1117;\">Kann Ihre Website nicht beschädigen</strong> — wenn Navi+ deaktiviert wird, kehrt das ursprüngliche Menü Ihres Themes automatisch zurück."
  feats_label: "Hauptfunktionen"
  f1_title: "5 Menütypen in einer App"
  f1_desc: "Mega Menu · Tab Bar · Slide Menu · FAB · Grid Menu. Kombinieren Sie nach Bedarf, gestalten Sie per Drag-and-Drop."
  f2_title: "Theme-unabhängig"
  f2_desc: "Wechseln Sie das Theme so oft Sie möchten, ohne Ihr Menü zu verlieren. Die Konfiguration wird unabhängig im Dashboard gespeichert."
  f3_title: "Analytics pro Item"
  f3_desc: "Impressionen · Klicks · CTR für jedes Item. Eine Funktion, die kaum ein anderer Menü-Builder bietet."
  f4_title: "Tiefe Website-Integration"
  f4_desc: "Warenkorb-Panel · Suche · Chat-Widget · JavaScript-API aufrufen. Nicht nur statische Links."
  f5_title: "Mehrsprachig & Shopify Markets"
  f5_desc: "Einmal konfigurieren, das Menü zeigt automatisch die richtige Sprache und Währung für jeden Markt."
  f6_title: "Bedingte Anzeige"
  f6_desc: "Nach Gerät · URL · Kundenstatus · Sprache. Alles ohne Code."
  f7_title: "Volle Autonomie"
  f7_desc: "Sale-Saison? Banner in 2 Minuten aktualisieren. Neues Produkt? Jetzt veröffentlichen. Kein Entwickler nötig."
  f8_title: "Echte Unterstützung"
  f8_desc: "Live-Chat im Dashboard, Antworten in Minuten. Navi+ Care ist bereit, für Sie zu gestalten."
