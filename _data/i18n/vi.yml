  enterprise:
    title: "Cần gói riêng cho agency hoặc enterprise?"
    body: "Liên hệ với chúng tôi để có volume pricing, white-label options và dedicated support."
  faq:
    title: "Câu hỏi về Pricing"
    subtitle: "Những điều cần biết trước khi chọn gói."
    items:
      - q: "Tôi vẫn muốn thử các tính năng Premium thì phải làm sao?"
        a: "Hầu hết tính năng nâng cao vẫn hiển thị trong editor để bạn hình dung cấu trúc menu. Ví dụ, upload ảnh có thể vẫn xuất hiện ở gói Starter, nhưng phần chỉ dành cho Premium sẽ bị làm mờ hoặc giới hạn. Để thử đầy đủ một cách an toàn, hãy nâng cấp lên gói trả phí và dùng 7 ngày miễn phí — bạn không mất đồng nào trong thời gian trial."
      - q: "Tôi nên bắt đầu với gói nào?"
        a: "Bắt đầu với Starter nếu bạn chỉ cần một menu Navi+ AI Menu Builder và muốn kiểm tra trải nghiệm. Chọn Business khi cần nhiều menu hơn, upload ảnh, đa ngôn ngữ, analytics và các tương tác nâng cao. Chọn Elite khi navigation là phần quan trọng của storefront và bạn muốn unlimited usage, SEO support, premium CDN và hỗ trợ trực tiếp."
      - q: "Điều gì xảy ra khi Starter hoặc Business chạm giới hạn views?"
        a: "Starter có tối đa 50,000 Navi+ AI Menu Builder views, còn Business có tối đa 500,000 Navi+ AI Menu Builder views mỗi tháng. Khi store chạm limit, bạn sẽ nhận email cảnh báo trước. Nếu việc này xảy ra nhiều lần, chúng tôi có thể đặt một quảng cáo nhỏ ở góc menu mà không ảnh hưởng đến trải nghiệm người dùng. Lưu ý: chúng tôi không bao giờ ẩn menu, vì điều đó sẽ ảnh hưởng đến khách hàng của bạn."
      - q: "Làm sao để thử Business hoặc Elite mà không rủi ro?"
        a: "Hãy dùng 7 ngày miễn phí để publish menu thật, thử premium interactions, upload ảnh và kiểm tra analytics trước khi trả tiền. Nếu Navi+ AI Menu Builder không phù hợp, chỉ cần hủy trước khi trial kết thúc và bạn sẽ không bị tính phí."
      - q: "Nếu downgrade sau này tôi có mất menu không?"
        a: "Không. Cấu hình của bạn được lưu lại. Nếu gói thấp hơn không giữ được tất cả tính năng đang active — ví dụ menu vượt giới hạn, upload ảnh, đa ngôn ngữ, advanced interactions hoặc SEO chỉ có ở Elite — bạn sẽ chọn phần nào tiếp tục active thay vì mất dữ liệu."
      - q: "Khi nào Elite tốt hơn Business?"
        a: "Chọn Elite khi bạn muốn bỏ các trần giới hạn: unlimited menus, unlimited views, advanced image tools, SEO Search optimization, CDN toàn cầu có failover mạnh hơn, never advertisements và hỗ trợ trực tiếp từ đội ngũ Navi+ AI Menu Builder. Đây là lựa chọn phù hợp khi navigation là một phần trung tâm của store, không chỉ là add-on nhỏ."
      - q: "Navi+ AI Menu Builder có thể thay thế các app trả phí khác không?"
        a: "Thường là có. Navi+ AI Menu Builder có thể thay thế một phần premium navigation themes, menu builders, floating contact buttons, công cụ cart/search icon và chat bubble replacements. Với Business từ $6.25/tháng, chi phí thường thấp hơn việc cài nhiều app nhỏ cùng lúc."
      - q: "Navi+ AI Menu Builder có dùng ngoài Shopify không?"
        a: "Có. Tạo tài khoản miễn phí tại dash.naviplus.app, lấy embed snippet và dán vào WordPress, Wix, Webflow hoặc bất kỳ website nào. Bạn vẫn dùng cùng cấu trúc gói và cùng Navi+ AI Menu Builder editor."
