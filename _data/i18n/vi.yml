  mega_menu_pts: ["Bố cục nhiều cột + hình ảnh", "Slot banner khuyến mãi nổi bật", "Sẵn sàng cho desktop & tablet"]
  slide_menu_pts: ["Điều hướng nhiều cấp", "Header với logo, tìm kiếm & tài khoản", "Icon, hình ảnh & badge"]
  fab_menu_pts: ["Tất cả liên hệ trong một nút", "Tích hợp sẵn Shopify Inbox", "Đặt bất kỳ vị trí nào"]
  grid_menu_pts: ["Hình ảnh danh mục thu hút click", "Lưới linh hoạt 2–4 cột", "Dùng làm menu hoặc section trang"]
  faq_label: "Câu hỏi thường gặp"
  faq_title: "Trước khi bắt đầu"
  faq1_q: "Navi+ có làm chậm website không?"
  faq1_a: "Không. Navi+ chạy trên CDN toàn cầu với máy chủ ở 6 châu lục, được tin dùng bởi hơn 5.000 merchant. Thường chỉ thêm dưới 10ms vào thời gian tải trang và liên tục được tối ưu hiệu suất."
  faq2_q: "Navi+ có ổn định không? Có cam kết uptime không?"
  faq2_a: "Tất cả các gói đều có hạ tầng chất lượng cao với SLA 99,00%. Gói Elite nâng cấp lên Cloudflare + BunnyCDN failover với SLA 99,99%. Navi+ đã phục vụ hàng triệu lượt điều hướng mà không có sự cố."
  faq3_q: "Mất bao lâu để ra mắt?"
  faq3_a: "Hầu hết cửa hàng ra mắt trong vòng 5 phút. Cài từ Shopify App Store (hoặc dán đoạn mã nhúng cho các nền tảng khác), chọn template và xuất bản — không cần code, không sửa theme."
  faq4_q: "Tôi có cần biết lập trình không?"
  faq4_a: "Hoàn toàn không. Navi+ dùng kéo-thả. Chọn template, tùy chỉnh màu sắc và icon rồi xuất bản. Người dùng nâng cao có thể thêm CSS hoặc HTML tuỳ chỉnh."
  faq5_q: "Có gói miễn phí không?"
  faq5_a: "Có. Gói Starter miễn phí mãi mãi — 1 menu, 50.000 lượt xem/tháng, đầy đủ tính năng cơ bản, không cần thẻ tín dụng. Nâng cấp khi bạn cần thêm."
  coming_soon_name: "Sắp ra mắt"
  coming_soon_desc: "Chúng tôi đang tiếp tục phát triển thêm các loại menu mới để website của bạn điều hướng tốt hơn."
  platform_other_name: "Bất kỳ website nào"
  platform_other_desc: "Tương thích với Wix, Squarespace, Webflow hoặc bất kỳ website nào. Chỉ cần nhúng một đoạn mã là menu Navi+ của bạn hoạt động ngay — không giới hạn nền tảng."
  platform_other_cta: "Tạo tài khoản miễn phí →"
  speed_label: "Hiệu suất"
  speed_title: "Siêu nhẹ.\nSiêu nhanh."
  speed_1_title: "Cắm vào, rút ra. Không để lại dấu vết."
  speed_1_body: "Một đoạn mã để cài, một cú nhấp để gỡ. Không sửa theme, không code thừa, không ràng buộc — website của bạn vẫn nguyên vẹn."
  speed_2_title: "Phân phối từ edge, không qua server của chúng tôi."
  speed_2_body: "Menu tải từ các node Cloudflare và BunnyCDN trên toàn cầu. Không có backend nào trong luồng tải chính — vẫn nhanh dù server chúng tôi gặp sự cố."
  speed_3_title: "Sẵn sàng cho AI."
  speed_3_body: "Tạo menu, viết nội dung và tối ưu điều hướng bằng AI. Mọi thao tác đều có AI hỗ trợ để bạn hoàn thành nhanh hơn."


why_navi_page:
  seo_title: "Tại sao Navi+? — 7 tiêu chí cho menu điều hướng chuyên nghiệp | Navi+"
  seo_desc: "Menu mặc định của theme quá đơn giản, khó tùy chỉnh và không đo được hiệu quả. Navi+ giải quyết cả 7 vấn đề mà một menu chuyên nghiệp cần đáp ứng."
  hero_tag: "Thiết kế & giao diện"
  problem_intro: "May mắn thì khách hàng tìm thấy thứ họ cần ngay trong vài giây đầu tiên đặt chân vào website của bạn. Nhưng nếu điều đó không xảy ra — và thực tế là phần lớn các lần truy cập đều như vậy — nơi đầu tiên họ tìm đến, nơi đầu tiên họ bấm vào, chính là menu điều hướng."
  p1_title: "Menu quá đơn giản, không đủ dùng"
  p1_desc: "Theme cấp cho bạn một hàng text phẳng. Không hình ảnh, không phân nhóm, không dẫn dắt được khách. Họ nhìn vào, không biết bạn bán gì — và thoát ra."
  p2_title: "Muốn thay đổi, nhưng không biết bắt đầu từ đâu"
  p2_desc: "Bạn biết menu cần cải thiện. Nhưng theme thì rối, app thì lo conflict, dev thì tốn tiền. Không có một con đường rõ ràng để đi."
  p3_title: "Khó điều khiển và duy trì theo thời gian"
  p3_desc: "Đổi theme là mất hết. Nâng cấp là rủi ro. Đổi banner mùa sale cũng phải nhờ dev. Menu — thứ đáng lẽ chủ động nhất — lại là thứ ít kiểm soát nhất."
  criteria_label: "Tiêu chuẩn nghề"
  criteria_title: "Đây là 7 điều bạn nên đòi hỏi từ một menu chuyên nghiệp"
  criteria_lead: "Menu là thành phần được khách hàng tương tác nhiều thứ hai trên toàn website (chỉ sau nút \"Add to cart\"). Đây là những gì bạn nên đòi hỏi:"
  c1_title: "Đủ dùng — và biết kể chuyện"
  c1_desc: "Phải có đủ các kiểu trình bày: Mega Menu cho desktop, Tab Bar cho mobile, Slide Menu cho hamburger gọn gàng, FAB cho các hành động khẩn, Grid Menu cho landing page. Quan trọng hơn: menu phải dẫn dắt hành trình mua hàng, không chỉ liệt kê danh mục."
  c2_title: "Tương thích — không conflict"
  c2_desc: "Phải sống hòa bình với phần còn lại của website. Không che mất giỏ hàng, không phá vỡ search panel, không đè lên chat widget. Khi đổi theme cũng không mất cấu hình — vì menu phải tồn tại độc lập với theme."
  c3_title: "Nhanh và cực kỳ đáng tin cậy"
  c3_desc: "Menu không bao giờ được \"chết\". Phải tải đủ nhanh, hoạt động cả khi mạng chậm, và không bao giờ block render trang chính. Nó là thành phần luôn sẵn sàng — bất cứ lúc nào, bất cứ thiết bị nào."
  c4_title: "Đo lường được — ở cấp độ từng item"
  c4_desc: "Phải đo được bao nhiêu lần item đó được hiển thị (impression) và bao nhiêu lần được click. Google Analytics không làm được điều này. Không có dữ liệu này, mọi thay đổi menu đều chỉ là phỏng đoán."
  c5_title: "Tương tác với app khác của website"
  c5_desc: "Phải gọi ra được hộp search, mở cart panel, kích hoạt chat widget. Phải gọi được JavaScript để tích hợp với bất kỳ app nào. Menu hiện đại là điểm điều khiển trung tâm — không phải bảng mục lục tĩnh."
  c6_title: "Đa ngôn ngữ và đa thị trường"
  c6_desc: "Tích hợp được với Shopify Markets, đa ngôn ngữ trên WordPress, hiển thị đúng tiền tệ, đúng nhãn cho từng thị trường. Đó là tiêu chuẩn, không phải tính năng cao cấp."
  c7_title: "Tự chủ — không phụ thuộc vào developer"
  c7_desc: "Bạn — chủ website — phải tự thay đổi được menu khi cần. Mùa sale, ra mắt bộ sưu tập mới, đổi chiến lược marketing, A/B test một layout khác — tất cả phải làm được bằng kéo thả, không cần thuê dev, không cần chờ deploy."
  solution_label: "Giải pháp"
