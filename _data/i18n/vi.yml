        - text: "<strong>4.000+</strong> icon Google Material Symbols, chỉnh được độ dày nét"
        - text: "Cấu hình nâng cao: Touch feedback, Navigation icons, Animation, Reusable Classes, Attributes"
        - text: "CDN tốt cho Bắc Mỹ, Châu Âu và Châu Á"
        - text: "24/7 support"
        - text: "Có thể có quảng cáo nếu usage vượt limit đáng kể, luôn email báo trước"
