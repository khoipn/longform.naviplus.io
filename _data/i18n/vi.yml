  how_title: "Từ cài đặt đến hoạt động trong vài phút"
  how_sub: "Không cần nhà thiết kế, không cần lập trình viên, không cần chỉnh sửa chủ đề. Navi+ AI Menu Builder được cắm vào cửa hàng hiện tại của bạn mà không cần chạm vào một dòng mã."
  step1_title: "Cài đặt Navi+ AI Menu Builder"
  step1_body: "Thêm ứng dụng từ Shopify App Store — hoặc dán một đoạn nhúng duy nhất trên WordPress, Wix, hoặc bất kỳ nền tảng nào. Gói miễn phí có sẵn, không cần thẻ tín dụng."
  step2_title: "Chọn một mẫu"
  step2_body: "Chọn từ 20+ bố cục điều hướng được thiết kế sẵn. Tab bar cho mobile, mega menu cho desktop, slide menu cho bất kỳ màn hình nào. Mỗi mẫu hoàn toàn có thể tùy chỉnh."
  step3_title: "Xuất bản và hướng dẫn khách truy cập"
  step3_body: "Kéo, thả và cấu hình. Menu mới của bạn được hoạt động ngay lập tức — siêu nhanh qua CDN edge trong 6 lục địa, xử lý hàng triệu yêu cầu mà không làm chậm cửa hàng của bạn."
  navtypes_label: "Các loại điều hướng"
  navtypes_title: "Được xây dựng cho mọi màn hình"
  navtypes_sub: "Mỗi loại điều hướng phục vụ một mục đích khác nhau — cấu hình chúng độc lập cho mobile và desktop từ một bảng điều khiển."
  mega_menu_desc: "Hiển thị menu thả xuống phong phú với các cột, hình ảnh và liên kết nổi bật. Hoàn hảo cho các cửa hàng có danh mục lớn — hướng dẫn khách mua hàng thẳng đến danh mục đúng mà không làm họ bị choáng ngợp."
  tab_bar_desc: "Thanh điều hướng dưới cùng cố định cho mobile — giống như các ứng dụng gốc. Đặt các trang quan trọng nhất của bạn chỉ cách một cái chạm ngón tay, tăng mức độ tham gia và giảm tỷ lệ thoát."
  slide_menu_desc: "Bảng trượt mượt mà tiết lộ điều hướng đầy đủ của bạn mà không rời khỏi trang. Lý tưởng cho các cửa hàng ưu tiên di động muốn có trải nghiệm duyệt web sạch sẽ, không bị xao lãng."
  sticky_navbar_desc: "Thanh điều hướng trên cùng luôn hiển thị khi khách truy cập cuộn trang. Giữ thương hiệu, tìm kiếm và giỏ hàng của bạn luôn có thể truy cập — giảm ma sát và tăng chuyển đổi."
