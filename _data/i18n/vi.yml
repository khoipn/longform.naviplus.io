  section_label: "Các loại menu"
  section_title: "Chọn menu phù hợp\nvới cửa hàng của bạn"
  section_sub: "Mỗi loại menu giải quyết một bài toán điều hướng khác nhau. Kết hợp linh hoạt trên từng trang và thiết bị."
