  faq_label: "Câu hỏi thường gặp"
  faq_title: "Các câu hỏi phổ biến"
  faq1_q: "Navi+ AI Menu Builder có xung đột với chủ đề hiện tại của tôi không?"
  faq1_a: "Không. Navi+ AI Menu Builder được xây dựng bằng HTML5 và CSS3 thuần, mà không có bất kỳ thư viện JavaScript bên ngoài nào. Điều này có nghĩa là không xung đột với chủ đề hoặc các ứng dụng khác — bất kể chủ đề nào bạn đang sử dụng."
  faq2_q: "Nó có hoạt động trên mobile và desktop không?"
  faq2_a: "Có. Navi+ AI Menu Builder được thiết kế ưu tiên di động, với các cấu hình riêng biệt cho mobile và desktop. Bạn có thể hiển thị Tab Bar trên mobile và Mega Menu trên desktop — hoàn toàn độc lập."
  faq3_q: "Tôi không ở trên Shopify. Tôi vẫn có thể sử dụng Navi+ AI Menu Builder không?"
  faq3_a: "Có. Navi+ AI Menu Builder hoạt động trên bất kỳ trang web nào thông qua mã nhúng đơn giản. Tạo tài khoản miễn phí tại dash.naviplus.app, thêm đoạn mã vào WordPress, Wix, Webflow, hoặc bất kỳ trang web nào, và bạn đã sẵn sàng."
  faq4_q: "Nó có làm chậm cửa hàng của tôi không?"
  faq4_a: "Không. Navi+ AI Menu Builder sử dụng CDN toàn cầu với máy chủ edge trên 6 lục địa và được 5,000+ thương nhân tin tưởng mà không có độ trễ. Nó được thiết kế để cực kỳ nhẹ và được tối ưu hóa liên tục để có hiệu suất tốt."
  faq5_q: "Gói miễn phí bao gồm những gì?"
  faq5_a: "Gói miễn phí bao gồm sử dụng trọn đời, 1 menu, 50,000 lượt xem/tháng, tất cả các tính năng cốt lõi và hỗ trợ email — không có quảng cáo. Các gói trả phí bắt đầu từ $6.25/tháng để có thêm menu, giới hạn lượt xem cao hơn và hỗ trợ 24/7."
  faq6_q: "Tôi có cần biết cách mã hóa không?"
  faq6_a: "Hoàn toàn không. Navi+ AI Menu Builder hoàn toàn kéo và thả. Chọn một mẫu, tùy chỉnh màu sắc và biểu tượng, và xuất bản — không cần kỹ năng thiết kế hoặc kỹ thuật. Những người dùng nâng cao có thể thêm CSS, HTML hoặc JavaScript tùy chỉnh nếu họ muốn đi xa hơn."
