en:
  - id: increase-conversions
    name: "Increase Conversions"
    desc: "Why are visitors leaving without buying? How can navigation turn browsers into buyers?"
    color: "#2f7d5b"
    order: 1
  - id: mobile-first
    name: "Mobile-First Navigation"
    desc: "80% of traffic is mobile — how do I build navigation that works with one thumb?"
    color: "#e07c3e"
    order: 2
  - id: choosing-menu
    name: "Choosing the Right Menu"
    desc: "Tab bar, mega menu, or slide menu — which one fits my store?"
    color: "#3a7ca5"
    order: 3
  - id: speed-performance
    name: "Speed & Performance"
    desc: "Is my menu slowing down my store? Will it hurt my Google rankings?"
    color: "#d4863a"
    order: 4
  - id: scaling-store
    name: "Scaling Your Store"
    desc: "My catalog grew from 50 to 500 products — how should navigation change?"
    color: "#4a8c6f"
    order: 5
  - id: design-branding
    name: "Design & Branding"
    desc: "How do I make my menu look professional and match my brand?"
    color: "#8b6f47"
    order: 6
  - id: international
    name: "International Selling"
    desc: "Multiple countries, languages, currencies — how do I handle navigation?"
    color: "#3a6b8c"
    order: 7
  - id: accessibility-seo
    name: "Accessibility & SEO"
    desc: "Can everyone use my navigation? Does it help or hurt my SEO?"
    color: "#6b5a8e"
    order: 8
  - id: checkout
    name: "Checkout Experience"
    desc: "Why do shoppers abandon at checkout? How does navigation affect the final step?"
    color: "#d64545"
    order: 9
  - id: getting-started
    name: "Getting Started"
    desc: "I'm new to custom navigation — where do I start?"
    color: "#5c4db1"
    order: 10

